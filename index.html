<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Household Hub: MealSync & Groceries</title>
    <style>
        :root {
            --bg-color: #F5F7FA;
            --surface-color: #FFFFFF;
            --text-main: #1A1C1E;
            --text-muted: #73777F;
            --primary-accent: #2E7D32; 
            --secondary-accent: #FF9800; 
            --glass-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --surface-color: #1A1A1A; 
                --text-main: #E2E2E2;
                --text-muted: #8E918F;
                --primary-accent: #4CAF50; 
                --glass-bg: rgba(26, 26, 26, 0.85);
                --border-color: rgba(255, 255, 255, 0.1);
                --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 0; padding-bottom: 120px;
            transition: background-color 0.4s ease, color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3 { margin: 0; }
        .container { padding: 24px 20px; max-width: 600px; margin: 0 auto; }
        .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: 24px 0 12px 0; font-weight: bold;}

        .bottom-nav {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 450px;
            background: var(--glass-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color); border-radius: 40px;
            display: flex; justify-content: space-around; padding: 12px 8px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.15); z-index: 1000;
        }

        .nav-item {
            background: none; border: none; color: var(--text-muted);
            font-size: 15px; font-weight: 600; padding: 12px 20px; border-radius: 30px;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .nav-item.active { background: var(--primary-accent); color: #FFFFFF; }

        .page { display: none; animation: fadePeek 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .page.active { display: block; }
        @keyframes fadePeek {
            from { opacity: 0; transform: translateX(20px) scale(0.98); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        .search-bar {
            width: 100%; padding: 16px 20px; border-radius: 16px; border: 1px solid var(--border-color);
            background: var(--surface-color); color: var(--text-main); font-size: 16px;
            margin-bottom: 24px; box-sizing: border-box; box-shadow: var(--card-shadow);
        }

        .horizontal-scroll { display: flex; overflow-x: auto; gap: 16px; padding-bottom: 16px; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }

        .recipe-card {
            min-width: 200px; background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 20px; box-shadow: var(--card-shadow); position: relative;
        }
        .chef-badge {
            position: absolute; top: -10px; right: -10px; background: var(--secondary-accent);
            color: white; font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 12px;
        }

        .day-group { margin-bottom: 24px; }
        .day-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;}
        
        .meal-card {
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 16px 20px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .meal-info h2 { font-size: 18px; margin-bottom: 4px; }
        .meal-info p { color: var(--text-muted); font-size: 14px; }

        .smart-cart-btn {
            background: rgba(76, 175, 80, 0.15); color: var(--primary-accent); border: none;
            width: 48px; height: 48px; border-radius: 24px; font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .smart-cart-btn:active { transform: scale(0.85); background: var(--primary-accent); color: white; }

        .grocery-item {
            background: var(--surface-color); border-radius: 16px; padding: 16px; margin-bottom: 12px;
            display: flex; align-items: center; border: 1px solid var(--border-color);
        }
        .grocery-item.dimmed { opacity: 0.5; background: transparent; }
        
        .checkbox {
            width: 24px; height: 24px; border: 2px solid var(--primary-accent); border-radius: 8px;
            margin-right: 16px; display: flex; align-items: center; justify-content: center; color: transparent;
        }
        .grocery-item.checked .checkbox { background: var(--primary-accent); color: white; }
        
        .item-details { flex-grow: 1; display: flex; align-items: center; justify-content: space-between; }
        .item-text-group { display: flex; flex-direction: column; }
        .item-name { font-size: 18px; font-weight: 500; }
        .item-flag { font-size: 12px; color: #F57C00; margin-top: 4px; font-weight: 600; }

        .qty-badge {
            background: rgba(76, 175, 80, 0.15); color: var(--primary-accent);
            padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer;
        }

        .swiggy-btn {
            background: var(--primary-accent); color: white; border: none; width: 100%;
            padding: 18px; border-radius: 16px; font-size: 18px; font-weight: bold;
            margin-top: 24px; cursor: pointer; box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
        }

        .overlay-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 2000;
        }
        .overlay-bg.active { opacity: 1; pointer-events: auto; }

        .bottom-sheet {
            position: fixed; bottom: -100%; left: 0; right: 0;
            background: var(--surface-color); border-radius: 32px 32px 0 0; padding: 32px 24px 60px 24px;
            transition: bottom 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 2001;
            border-top: 1px solid var(--border-color);
        }
        .bottom-sheet.active { bottom: 0; }

        .unit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
        .unit-btn {
            background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 18px 0; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer;
        }

        .guided-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color); z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 24px; text-align: center;
        }
        .guided-overlay.active { opacity: 1; pointer-events: auto; }
        
        .shopping-progress { color: var(--text-muted); font-size: 16px; margin-bottom: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .shopping-item-name { font-size: 36px; font-weight: bold; margin-bottom: 48px; color: var(--text-main); }
        
        .action-btn { background: var(--primary-accent); color: white; border: none; width: 100%; max-width: 350px; padding: 20px; border-radius: 16px; font-size: 20px; font-weight: bold; margin-bottom: 16px; cursor: pointer; box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3); }
        .action-btn:active { transform: scale(0.95); }
        .close-shopping { position: absolute; top: 40px; right: 24px; background: none; border: none; font-size: 32px; color: var(--text-muted); cursor: pointer; }
        
        #sync-status {
            text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="overlay-bg" id="picker-overlay" onclick="closePicker()"></div>
    <div class="bottom-sheet" id="bottom-sheet">
        <h2 id="picker-title" style="text-align: center; margin-bottom: 8px;">Select Quantity</h2>
        <div class="unit-grid" id="picker-grid"></div>
    </div>

    <div class="guided-overlay" id="guided-overlay">
        <button class="close-shopping" onclick="closeGuidedShopping()">×</button>
        <div class="shopping-progress" id="shopping-progress">Item 1 of X</div>
        <div class="shopping-item-name" id="shopping-item-name">Item</div>
        
        <button class="action-btn" onclick="markDoneAndNext()">Mark Done & Auto-Search Next</button>
    </div>

    <div class="container">
        
        <div id="page-discover" class="page active">
            <h1 style="margin-bottom: 24px;">Discover</h1>
            <input type="text" class="search-bar" placeholder="🔍 Search recipes, cuisines...">
            
            <div class="section-title">Chef Specials</div>
            <div class="horizontal-scroll" id="chef-specials-list"></div>

            <div class="section-title">All Recipes</div>
            <div id="all-recipes-list"></div>
        </div>

        <div id="page-planner" class="page">
            <h1 style="margin-bottom: 24px;">Weekly Calendar</h1>
            <div id="weekly-calendar"></div>
        </div>

        <div id="page-cart" class="page">
            <h1 style="margin-bottom: 12px;">Grocery Cart</h1>
            <p style="color: var(--text-muted); margin-bottom: 24px;">Tap amounts to edit units.</p>
            
            <div class="section-title">Ready to Buy</div>
            <div id="active-items"></div>

            <div class="section-title">Recently Bought</div>
            <div id="dimmed-items"></div>

            <button class="swiggy-btn" onclick="startGuidedShopping()">🛒 Start Guided Shopping</button>
            <div id="sync-status">Status: Connecting to Database...</div>
        </div>

    </div>

    <div class="bottom-nav">
        <button class="nav-item active" id="nav-discover" onclick="switchTab('discover')">💡 Discover</button>
        <button class="nav-item" id="nav-planner" onclick="switchTab('planner')">📅 Plan</button>
        <button class="nav-item" id="nav-cart" onclick="switchTab('cart')">🛒 Cart</button>
    </div>

    <script>
        const GOOGLE_WEB_APP_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE";

        const UNIT_TYPES = {
            "Milk": ["500 ml", "1 L", "2 L"],
            "Curd": ["200 g", "500 g", "1 kg"],
            "Potatoes": ["500 g", "1 kg", "2 kg", "5 kg", "10 kg"],
            "Capsicum": ["250 g", "500 g", "1 kg"],
            "Flour": ["1 kg", "2 kg", "5 kg", "10 kg"],
            "Eggs": ["6 Pack", "12 Pack", "30 Pack"],
            "default": ["1", "2", "3", "4", "5"]
        };

        let DB = {
            recipesMaster: [],
            plannedMeals: {},
            orderHistory: [],
            cart: []
        };

        async function initApp() { 
            await fetchDatabaseSync();
            renderDiscover(); 
            renderPlanner(); 
            renderCart(); 
        }

        async function fetchDatabaseSync() {
            try {
                document.getElementById('sync-status').innerText = "Status: Syncing with Google Sheets...";
                if(GOOGLE_WEB_APP_URL !== "YOUR_GOOGLE_SCRIPT_URL_HERE") {
                    const response = await fetch(`${GOOGLE_WEB_APP_URL}?action=getAllData`);
                    const data = await response.json();
                    DB = data; 
                } else {
                    DB = {
                        recipesMaster: [
                            { id: "r1", name: "Aloo Shimla Mirch", tags: "Dry Veg", isChefSpecial: true, ingredients: [{name: "Potatoes", defaultQty: "1 kg"}, {name: "Capsicum", defaultQty: "500 g"}, {name: "Curd", defaultQty: "500 g"}] },
                            { id: "r2", name: "Paneer Do Pyaza", tags: "Gravy", isChefSpecial: false, ingredients: [{name: "Paneer", defaultQty: "500 g"}, {name: "Onions", defaultQty: "1 kg"}] }
                        ],
                        plannedMeals: { "Tuesday": ["Aloo Shimla Mirch"], "Thursday": ["Paneer Do Pyaza"] },
                        orderHistory: [{ item: "Curd", date: "2 days ago" }],
                        cart: []
                    };
                }
                document.getElementById('sync-status').innerText = "Status: Synced Successfully";
            } catch (error) {
                document.getElementById('sync-status').innerText = "Status: Offline (Using Local Cache)";
                console.error("Database sync failed", error);
            }
        }

        function triggerHaptic() { if (navigator.vibrate) navigator.vibrate(15); }

        function switchTab(tabId) {
            triggerHaptic();
            document.querySelectorAll('.page, .nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`page-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');
        }

        function renderDiscover() {
            document.getElementById('chef-specials-list').innerHTML = DB.recipesMaster.filter(r => r.isChefSpecial).map(r => `
                <div class="recipe-card">
                    <div class="chef-badge">Chef Special</div>
                    <h2 style="font-size: 18px; margin-bottom: 8px;">${r.name}</h2>
                    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">${r.tags}</p>
                    <button class="smart-cart-btn" style="width: 100%; border-radius: 12px;" onclick="breakdownRecipe('${r.id}')">Add to Cart</button>
                </div>
            `).join('');

            document.getElementById('all-recipes-list').innerHTML = DB.recipesMaster.map(r => `
                <div class="meal-card">
                    <div class="meal-info"><h2>${r.name}</h2><p>${r.tags}</p></div>
                    <button class="smart-cart-btn" onclick="breakdownRecipe('${r.id}')">🛒</button>
                </div>
            `).join('');
        }

        function renderPlanner() {
            let plannerHtml = '';
            for (const [day, meals] of Object.entries(DB.plannedMeals)) {
                plannerHtml += `<div class="day-group"><div class="day-title">${day}</div>`;
                if (!meals || meals.length === 0) plannerHtml += `<p style="color: var(--text-muted); font-size: 14px; margin-left: 8px;">No meals planned.</p>`;
                else {
                    meals.forEach(mealName => {
                        const recipe = DB.recipesMaster.find(r => r.name === mealName);
                        plannerHtml += `
                            <div class="meal-card">
                                <div class="meal-info"><h2>${mealName}</h2><p>Dinner</p></div>
                                <button class="smart-cart-btn" onclick="breakdownRecipe('${recipe.id}')">🛒</button>
                            </div>
                        `;
                    });
                }
                plannerHtml += `</div>`;
            }
            document.getElementById('weekly-calendar').innerHTML = plannerHtml || '<p style="color: var(--text-muted);">No data found.</p>';
        }

        function breakdownRecipe(recipeId) {
            triggerHaptic();
            const recipe = DB.recipesMaster.find(r => r.id === recipeId);
            
            recipe.ingredients.forEach(ing => {
                const recentOrder = DB.orderHistory.find(h => h.item === ing.name);
                const exists = DB.cart.find(c => c.name === ing.name);
                if(!exists) {
                    DB.cart.push({ 
                        name: ing.name, quantity: ing.defaultQty, 
                        checked: !recentOrder, recent: !!recentOrder, 
                        flag: recentOrder ? "Ordered in last 7 days" : "" 
                    });
                }
            });
            renderCart();
            switchTab('cart');
            syncCartToBackend();
        }

        function toggleItem(index) {
            triggerHaptic();
            DB.cart[index].checked = !DB.cart[index].checked;
            renderCart();
            syncCartToBackend();
        }

        let currentEditIndex = null;
        function openPicker(event, index) {
            event.stopPropagation();
            triggerHaptic();
            currentEditIndex = index;
            const item = DB.cart[index];
            const options = UNIT_TYPES[item.name] || UNIT_TYPES["default"];
            
            document.getElementById('picker-title').innerText = item.name;
            document.getElementById('picker-grid').innerHTML = options.map(opt => 
                `<button class="unit-btn" onclick="selectQuantity('${opt}')">${opt}</button>`
            ).join('');
            
            document.getElementById('picker-overlay').classList.add('active');
            document.getElementById('bottom-sheet').classList.add('active');
        }

        function selectQuantity(qty) {
            triggerHaptic();
            DB.cart[currentEditIndex].quantity = qty;
            closePicker();
            renderCart();
            syncCartToBackend();
        }

        function closePicker() {
            document.getElementById('picker-overlay').classList.remove('active');
            document.getElementById('bottom-sheet').classList.remove('active');
        }

        function renderCart() {
            let activeHtml = '', dimmedHtml = '';

            DB.cart.forEach((item, index) => {
                const checkedClass = item.checked ? 'checked' : '';
                const dimClass = item.recent && !item.checked ? 'dimmed' : '';
                const checkMark = item.checked ? '✓' : '';
                const flagHtml = item.flag ? `<div class="item-flag">🕒 ${item.flag}</div>` : '';

                const html = `
                    <div class="grocery-item ${checkedClass} ${dimClass}" onclick="toggleItem(${index})">
                        <div class="checkbox">${checkMark}</div>
                        <div class="item-details">
                            <div class="item-text-group"><div class="item-name">${item.name}</div>${flagHtml}</div>
                            <div class="qty-badge" onclick="openPicker(event, ${index})">${item.quantity} ▾</div>
                        </div>
                    </div>
                `;
                if (item.recent && !item.checked) dimmedHtml += html;
                else activeHtml += html;
            });

            document.getElementById('active-items').innerHTML = activeHtml || '<p style="color:var(--text-muted)">No active items.</p>';
            document.getElementById('dimmed-items').innerHTML = dimmedHtml || '<p style="color:var(--text-muted)">No recently bought items.</p>';
        }

        let shoppingQueue = [];
        let shoppingIndex = 0;

        function startGuidedShopping() {
            triggerHaptic();
            shoppingQueue = DB.cart.filter(item => item.checked);
            if(shoppingQueue.length === 0) return alert("Check at least one item.");
            
            shoppingIndex = 0;
            updateGuidedUI();
            document.getElementById('guided-overlay').classList.add('active');

            const firstItem = shoppingQueue[0];
            const searchQuery = encodeURIComponent(firstItem.name);
            setTimeout(() => {
                window.location.href = `swiggy://instamart/search?query=${searchQuery}`;
            }, 300);
        }

        function updateGuidedUI() {
            const item = shoppingQueue[shoppingIndex];
            document.getElementById('shopping-progress').innerText = `Item ${shoppingIndex + 1} of ${shoppingQueue.length}`;
            document.getElementById('shopping-item-name').innerText = `${item.quantity} ${item.name}`;
        }

        function markDoneAndNext() {
            triggerHaptic();
            
            const currentItem = shoppingQueue[shoppingIndex];
            const dbIndex = DB.cart.findIndex(c => c.name === currentItem.name);
            
            if(dbIndex !== -1) {
                DB.cart[dbIndex].checked = false;
                DB.cart[dbIndex].recent = true;
                DB.cart[dbIndex].flag = "Just Bought";
            }

            shoppingIndex++;
            
            if(shoppingIndex >= shoppingQueue.length) {
                closeGuidedShopping();
                syncCartToBackend();
            } else {
                updateGuidedUI();
                const nextItem = shoppingQueue[shoppingIndex];
                const searchQuery = encodeURIComponent(nextItem.name);
                setTimeout(() => {
                    window.location.href = `swiggy://instamart/search?query=${searchQuery}`;
                }, 300);
            }
        }

        function closeGuidedShopping() {
            triggerHaptic();
            document.getElementById('guided-overlay').classList.remove('active');
            renderCart();
        }

        async function syncCartToBackend() {
            if(GOOGLE_WEB_APP_URL === "YOUR_GOOGLE_SCRIPT_URL_HERE") return;
            try {
                await fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'syncCart', cart: DB.cart })
                });
            } catch(e) {
                console.error("Background sync failed", e);
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
