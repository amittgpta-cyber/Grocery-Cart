<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Grocery List</title>
    <style>
        :root {
            --primary-color: #2E7D32;
            --bg-selected: #E8F5E9;
            --bg-prev-ordered: #E3F2FD;
            --text-prev-ordered: #1565C0;
            --ai-text: #1976D2;
            --btn-bg: #4CAF50;
            --btn-toggle: #1976D2;
            --btn-reorder: #FF9800;
            --text-main: #333333;
            --text-muted: #757575;
            --border-color: #eeeeee;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f5f5f5;
            color: var(--text-main);
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 16px;
            margin-top: 32px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .list-item-container {
            border-bottom: 1px solid var(--border-color);
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .list-item-container.selected {
            background-color: var(--bg-selected);
        }

        .list-item-container.selected .item-name {
            color: var(--primary-color);
        }

        .list-item-container.prev-ordered {
            background-color: var(--bg-prev-ordered);
        }
        
        .list-item-container.prev-ordered .item-name {
            color: var(--text-prev-ordered);
        }

        .icon-container {
            width: 28px;
            height: 28px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 18px;
        }

        .item-details {
            flex-grow: 1;
        }

        .item-name {
            font-size: 16px;
            font-weight: 500;
        }

        .item-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .quantity-selector {
            padding: 0 16px 16px 56px;
            display: none;
        }

        .list-item-container.selected .quantity-selector {
            display: block;
        }

        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
            width: 150px;
        }

        .ai-reason { color: var(--ai-text); }

        .bookmark-btn {
            background: none;
            border: none;
            color: #F57C00;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .main-btn {
            display: block;
            width: 100%;
            padding: 16px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .toggle-btn {
            background-color: var(--btn-toggle);
            flex: 1;
        }

        .reorder-btn {
            background-color: var(--btn-reorder);
            flex: 1;
        }

        .submit-btn {
            background-color: var(--btn-bg);
            margin-top: 32px;
        }

        .submit-btn:disabled {
            background-color: #A5D6A7;
            cursor: not-allowed;
        }

        #loading-indicator {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-style: italic;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-content h2 {
            margin-top: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        #review-list-container {
            margin: 16px 0;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 16px;
            line-height: 1.8;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        .back-btn {
            background-color: #9E9E9E;
            flex: 1;
            padding: 12px;
        }

        .confirm-btn {
            background-color: var(--btn-bg);
            flex: 1;
            padding: 12px;
        }

        .confirm-btn:disabled {
            background-color: #A5D6A7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Monthly Grocery List</h1>

    <div id="loading-indicator">Syncing with database...</div>

    <div id="main-list-container" style="display: none;">
        
        <div class="button-group">
            <button class="main-btn toggle-btn" id="toggle-list-btn" onclick="toggleGroceryList()">Grocery List ▼</button>
            <button class="main-btn reorder-btn" onclick="reorderLast()">🔁 Reorder Last</button>
        </div>
        
        <div id="grocery-list-wrapper" style="display: none;">
            <div id="main-grocery-list"></div>
        </div>

        <h2>AI Suggestions</h2>
        <div id="ai-recommendations-list"></div>

        <button class="main-btn submit-btn" onclick="openReviewModal()">Review & Share to WhatsApp</button>
    </div>
</div>

<div class="modal-overlay" id="review-modal">
    <div class="modal-content">
        <h2>Review Your List</h2>
        <div id="review-list-container"></div>
        <div class="modal-buttons">
            <button class="main-btn back-btn" onclick="closeReviewModal()">Go Back & Edit</button>
            <button class="main-btn confirm-btn" id="confirm-submit-btn" onclick="confirmAndSend()">Confirm & Send</button>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SHEET_API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; 
    let databaseItems = [];
    let currentRecommendations = [];

    const quantityOptions = {
        'Weight': ["100g", "250g", "500g", "1kg", "2kg", "3kg", "5kg", "10kg"],
        'Volume': ["250ml", "500ml", "1L", "2L", "5L"],
        'Count': ["1", "2", "3", "4", "5", "6", "10", "1 Dozen", "2 Dozen"]
    };

    const defaultQuantities = {
        'Weight': '1kg',
        'Volume': '1L',
        'Count': '1'
    };

    const aiIntelligenceRules = [
        { triggers: ["bread", "wheat flour", "maida"], suggestion: { name: "Butter", contextReason: "Usually bought with baking goods & breads" } },
        { triggers: ["bread"], suggestion: { name: "Jam", contextReason: "Frequently purchased with Bread" } },
        { triggers: ["milk", "curd"], suggestion: { name: "Oats", contextReason: "Pairs well with dairy" } },
        { triggers: ["onions", "tomatoes", "potatoes"], suggestion: { name: "Coriander", contextReason: "Enhances fresh produce" } },
        { triggers: ["onions", "tomatoes"], suggestion: { name: "Garlic", contextReason: "Often bought together" } },
        { triggers: ["tea leaves", "coffee powder"], suggestion: { name: "Biscuits", contextReason: "Trending essential for beverages" } },
        { triggers: ["eggs"], suggestion: { name: "Mayonnaise", contextReason: "Pairs perfectly with eggs" } },
        { triggers: ["baby diapers"], suggestion: { name: "Baby Wipes", contextReason: "Essential baby care combo" } }
    ];

    window.onload = fetchDatabaseItems;

    async function fetchDatabaseItems() {
        try {
            const response = await fetch(GOOGLE_SHEET_API_URL);
            const data = await response.json();
            
            databaseItems = data.map(item => ({
                ...item, 
                selected: false,
                currentQuantity: item.lastQuantity || defaultQuantities[item.unitType] || '1'
            }));

            document.getElementById('loading-indicator').style.display = 'none';
            document.getElementById('main-list-container').style.display = 'block';
            
            renderGroceryList();
            updateRecommendations();
        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById('loading-indicator').innerText = "Failed to load database. Please check connection.";
        }
    }

    function toggleGroceryList() {
        const wrapper = document.getElementById('grocery-list-wrapper');
        const btn = document.getElementById('toggle-list-btn');
        if (wrapper.style.display === 'none') {
            wrapper.style.display = 'block';
            btn.innerText = 'Grocery List ▲';
        } else {
            wrapper.style.display = 'none';
            btn.innerText = 'Grocery List ▼';
        }
    }

    function reorderLast() {
        let itemsSelected = false;
        databaseItems.forEach(item => {
            if (item.orderedInLast30Days) {
                item.selected = true;
                itemsSelected = true;
            }
        });

        if (!itemsSelected) {
            alert("No previous orders found in the last 30 days.");
            return;
        }

        const wrapper = document.getElementById('grocery-list-wrapper');
        const btn = document.getElementById('toggle-list-btn');
        if (wrapper.style.display === 'none') {
            wrapper.style.display = 'block';
            btn.innerText = 'Grocery List ▲';
        }

        renderGroceryList();
        updateRecommendations();
    }

    function renderGroceryList() {
        const container = document.getElementById('main-grocery-list');
        container.innerHTML = '';

        databaseItems.forEach(item => {
            const isPrevOrdered = item.orderedInLast30Days && !item.selected;
            const div = document.createElement('div');
            div.className = `list-item-container ${item.selected ? 'selected' : ''} ${isPrevOrdered ? 'prev-ordered' : ''}`;

            const checkIcon = item.selected ? '✓' : '';
            const recentFlag = item.orderedInLast30Days ? '<div class="item-meta">Ordered in last 30 days</div>' : '';

            const optionsHTML = (quantityOptions[item.unitType] || quantityOptions['Count'])
                .map(opt => `<option value="${opt}" ${item.currentQuantity === opt ? 'selected' : ''}>${opt}</option>`)
                .join('');

            div.innerHTML = `
                <div class="list-item" onclick="toggleSelection(${item.id})">
                    <div class="icon-container">${checkIcon}</div>
                    <div class="item-details">
                        <div class="item-name">${item.name}</div>
                        ${recentFlag}
                    </div>
                </div>
                <div class="quantity-selector">
                    <select onchange="updateQuantity(${item.id}, this.value)">
                        ${optionsHTML}
                    </select>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function toggleSelection(id) {
        const item = databaseItems.find(i => i.id === id);
        if (item) {
            item.selected = !item.selected;
            renderGroceryList();
            updateRecommendations();
        }
    }

    function updateQuantity(id, value) {
        const item = databaseItems.find(i => i.id === id);
        if (item) {
            item.currentQuantity = value;
        }
    }

    function updateRecommendations() {
        currentRecommendations = [];
        const selectedItems = databaseItems.filter(i => i.selected).map(i => i.name.trim().toLowerCase());

        if (selectedItems.length > 0) {
            aiIntelligenceRules.forEach(rule => {
                const isTriggered = rule.triggers.some(trigger => 
                    selectedItems.some(selected => selected.includes(trigger.toLowerCase()))
                );

                if (isTriggered) {
                    const suggName = rule.suggestion.name.trim().toLowerCase();
                    const existsInDb = databaseItems.some(dbItem => dbItem.name.trim().toLowerCase() === suggName);
                    const alreadySuggested = currentRecommendations.some(rec => rec.name.trim().toLowerCase() === suggName);

                    if (!existsInDb && !alreadySuggested) {
                        currentRecommendations.push({
                            id: Date.now() + Math.random(),
                            name: rule.suggestion.name,
                            contextReason: rule.suggestion.contextReason
                        });
                    }
                }
            });
        }

        renderAIList();
    }

    function renderAIList() {
        const container = document.getElementById('ai-recommendations-list');
        container.innerHTML = '';

        if (currentRecommendations.length === 0) {
            container.innerHTML = '<div class="item-meta" style="padding: 16px 0;">Select items from the grocery list to see AI suggestions here.</div>';
            return;
        }

        currentRecommendations.forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item-container';
            
            div.innerHTML = `
                <div class="list-item">
                    <div class="icon-container" style="color: #1976D2;">✨</div>
                    <div class="item-details">
                        <div class="item-name">${item.name}</div>
                        <div class="item-meta ai-reason">${item.contextReason}</div>
                    </div>
                    <button class="bookmark-btn" onclick="handleBookmarkClick(${item.id}, this)">➕</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    async function handleBookmarkClick(id, buttonElement) {
        const index = currentRecommendations.findIndex(i => i.id === id);
        if (index === -1) return;

        buttonElement.style.opacity = '0.5';
        buttonElement.disabled = true;

        const aiItem = currentRecommendations[index];

        try {
            await fetch(GOOGLE_SHEET_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'addItem', name: aiItem.name }),
            });

            databaseItems.unshift({
                id: Date.now(),
                name: aiItem.name,
                orderedInLast30Days: false,
                selected: true,
                unitType: 'Count',
                currentQuantity: '1',
                count: 0
            });

            updateRecommendations(); 
            renderGroceryList();
            
            const listWrapper = document.getElementById('grocery-list-wrapper');
            const toggleBtn = document.getElementById('toggle-list-btn');
            if (listWrapper.style.display === 'none') {
                listWrapper.style.display = 'block';
                toggleBtn.innerText = 'Grocery List ▲';
            }

        } catch (e) {
            alert("Failed to add to database.");
            buttonElement.style.opacity = '1';
            buttonElement.disabled = false;
        }
    }

    function openReviewModal() {
        const selectedItems = databaseItems.filter(i => i.selected);
        if (selectedItems.length === 0) {
            alert("Please select at least one item.");
            return;
        }

        const container = document.getElementById('review-list-container');
        container.innerHTML = selectedItems.map(i => `✅ <strong>${i.name}</strong> - ${i.currentQuantity}`).join('<br>');
        
        document.getElementById('review-modal').style.display = 'flex';
    }

    function closeReviewModal() {
        document.getElementById('review-modal').style.display = 'none';
    }

    async function confirmAndSend() {
        const selectedItems = databaseItems.filter(i => i.selected);
        const btn = document.getElementById('confirm-submit-btn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const payload = selectedItems.map(i => ({ name: i.name, quantity: i.currentQuantity }));

        try {
            await fetch(GOOGLE_SHEET_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'submit', items: payload }),
            });
            
            const formattedItems = selectedItems.map(i => `✅ ${i.name} - ${i.currentQuantity}`).join('%0A');
            const textMessage = `Hi! Here is the monthly grocery list:%0A%0A${formattedItems}`;
            
            window.open(`whatsapp://send?text=${textMessage}`, '_blank');
            closeReviewModal();
        } catch (error) {
            alert("Failed to sync with database. Please try again.");
        } finally {
            btn.innerText = "Confirm & Send";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
