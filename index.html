<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MealPlanner</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192x192.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-bg: #000000;
      --color-surface: #111111;
      --color-surface-elevated: #1a1a1a;
      --color-text: #ffffff;
      --color-text-muted: #888888;
      --color-accent: #333333;
      --color-brand: #ffffff;
      --color-border: #222222;
      --color-success: #32d74b;
      --color-danger: #ff453a;
      
      --font-display: 'Playfair Display', serif;
      --font-body: 'Inter', sans-serif;
      
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      
      --safe-top: env(safe-area-inset-top, 44px);
      --safe-bottom: env(safe-area-inset-bottom, 34px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; height: 100%; }
    body { 
      min-height: 100%; 
      font-family: var(--font-body); 
      background: var(--color-bg); 
      color: var(--color-text); 
      overflow-x: hidden; 
      overscroll-behavior-y: contain; 
      user-select: none; 
    }

    button, input, select { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    button:active { opacity: 0.7; }
    input, select { 
      width: 100%; 
      background: var(--color-surface); 
      border: 1px solid var(--color-border); 
      color: var(--color-text); 
      padding: 12px 16px; 
      border-radius: var(--radius-md); 
      font-size: 16px; 
      transition: border-color 0.2s ease;
    }
    input:focus, select:focus { outline: none; border-color: var(--color-text-muted); }
    input::placeholder { color: var(--color-text-muted); }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      padding-top: calc(var(--safe-top) + 70px);
      padding-bottom: calc(var(--safe-bottom) + 80px);
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      border-bottom: 1px solid var(--color-border);
      padding-top: var(--safe-top);
    }
    
    .topbar-content {
      max-width: 600px;
      margin: 0 auto;
      padding: var(--spacing-sm) var(--spacing-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
    }
    .brand h1 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .header-actions { display: flex; gap: var(--spacing-sm); }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--color-border);
      transition: background 0.2s ease;
    }

    .main-content {
      flex: 1;
      padding: 0 var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xl);
    }

    .view-section { display: none; animation: fadeIn 0.3s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .section-header {
      margin-bottom: var(--spacing-md);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      color: var(--color-brand);
    }

    .meal-grid { display: flex; flex-direction: column; gap: var(--spacing-sm); }
    
    .meal-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .meal-info { flex: 1; min-width: 0; padding-right: var(--spacing-md); }
    .meal-name {
      font-weight: 500;
      font-size: 16px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meal-meta {
      font-size: 13px;
      color: var(--color-text-muted);
      display: flex;
      gap: var(--spacing-sm);
      align-items: center;
    }
    .badge {
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge.veg { background: rgba(50, 215, 75, 0.15); color: var(--color-success); }
    .badge.non-veg { background: rgba(255, 69, 58, 0.15); color: var(--color-danger); }
    
    .card-actions { display: flex; gap: var(--spacing-sm); }
    .action-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: var(--color-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-btn.primary { background: var(--color-text); color: var(--color-bg); }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--color-border);
      padding-bottom: var(--safe-bottom);
      z-index: 100;
    }
    .nav-content {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-around;
      padding: var(--spacing-sm) 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--color-text-muted);
      flex: 1;
      padding: var(--spacing-xs) 0;
    }
    .nav-item.active { color: var(--color-brand); }
    .nav-item svg { width: 24px; height: 24px; stroke-width: 2; }
    .nav-label { font-size: 11px; font-weight: 500; }
    
    .cart-badge {
      position: absolute;
      top: -4px;
      right: calc(50% - 16px);
      background: var(--color-danger);
      color: white;
      font-size: 10px;
      font-weight: bold;
      height: 16px;
      min-width: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid var(--color-bg);
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cart-badge.visible { opacity: 1; transform: scale(1); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      display: flex;
      align-items: flex-end;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    
    .modal-content {
      background: var(--color-bg);
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: var(--spacing-lg) var(--spacing-md) calc(var(--safe-bottom) + var(--spacing-md));
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--color-border);
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
    }
    .modal-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
    
    /* ADD ITEM ROW FIXES */
    .add-row {
      display: flex;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
      align-items: center;
    }
    .add-row input { flex: 2; }
    .add-row select { flex: 1.5; padding: 12px; }
    .btn-add-master {
      flex: 0.5;
      background: var(--color-text);
      color: var(--color-bg);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
    }
    
    /* HORIZONTAL FILTER RIBBON */
    .filter-ribbon {
      display: flex;
      overflow-x: auto;
      gap: var(--spacing-sm);
      padding-bottom: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .filter-ribbon::-webkit-scrollbar { display: none; }
    .filter-chip {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      white-space: nowrap;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .filter-chip.active {
      background: var(--color-text);
      color: var(--color-bg);
      border-color: var(--color-text);
    }
    .filter-chip.top-picks { border-color: #ffd700; color: #ffd700; }
    .filter-chip.top-picks.active { background: #ffd700; color: #000; }

    .master-list-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
    }
    
    .master-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px var(--spacing-md);
      border-bottom: 1px solid var(--color-border);
    }
    .master-item:last-child { border-bottom: none; }
    .master-info { display: flex; flex-direction: column; gap: 2px; }
    .master-name { font-weight: 500; font-size: 15px; }
    .master-meta { font-size: 12px; color: var(--color-text-muted); display: flex; gap: 8px; }

    .input-group { margin-bottom: var(--spacing-md); }
    .search-bar { margin-bottom: var(--spacing-md); }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: var(--color-text); color: var(--color-bg); }
    
    .cart-item {
      display: flex;
      align-items: center;
      padding: var(--spacing-md) 0;
      border-bottom: 1px solid var(--color-border);
      gap: var(--spacing-md);
    }
    .cart-item.checked .cart-name { text-decoration: line-through; color: var(--color-text-muted); }
    .checkbox-custom {
      width: 24px;
      height: 24px;
      border: 2px solid var(--color-text-muted);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .cart-item.checked .checkbox-custom {
      background: var(--color-success);
      border-color: var(--color-success);
    }
    .cart-item.checked .checkbox-custom::after {
      content: '';
      width: 6px; height: 12px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translateY(-2px);
    }
    .cart-info { flex: 1; }
    .cart-name { font-size: 16px; font-weight: 500; transition: color 0.2s ease; }
    .cart-context { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }

    .empty-state {
      padding: var(--spacing-xl) 0;
      text-align: center;
      color: var(--color-text-muted);
    }

    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--color-bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--color-surface-elevated);
      border-top-color: var(--color-brand);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: var(--spacing-md);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--color-text-muted);">Syncing Pantry...</div>
  </div>

  <header class="topbar">
    <div class="topbar-content">
      <div class="brand">
        <img class="brand-logo" src="icon-512x512.png" alt="Logo" style="object-fit: cover; padding: 0; border: none; background: transparent;" />
        <h1>MealPlanner</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="app.sync(true)" title="Force Sync">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="icon-btn" onclick="app.openMasterList()" title="Master Grocery">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19V5a2 2 0 0 1 2-2h13.4a.5.5 0 0 1 .49.6L17 12l2.9 8.4a.5.5 0 0 1-.49.6H6a2 2 0 0 1-2-2Z"/><path d="M6 15h11"/><path d="M6 9h11"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="app-container">
    
    <main id="view-cookbook" class="view-section active">
      
      <div class="input-group" style="background: var(--color-surface); padding: var(--spacing-md); border-radius: var(--radius-md); border: 1px solid var(--color-border);">
        <div style="display: flex; gap: var(--spacing-sm); margin-bottom: var(--spacing-sm);">
          <input type="text" id="manualMealInput" placeholder="Add a meal manually..." style="flex: 2; background: var(--color-bg);">
          <select id="manualCategoryInput" style="flex: 1.2; background: var(--color-bg);">
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Dessert">Dessert</option>
            <option value="Drinks">Drinks</option>
            <option value="Cocktails">Cocktails</option>
          </select>
        </div>
        <div style="display: flex; gap: var(--spacing-sm); align-items: center;">
          <select id="manualDietInput" style="flex: 1; background: var(--color-bg);">
            <option value="veg">Veg</option>
            <option value="non-veg">Non-Veg</option>
          </select>
          <button class="btn btn-primary" onclick="app.addManualMeal()" style="flex: 2; padding: 12px;">Add Meal</button>
        </div>
      </div>

      <div class="search-bar">
        <input type="text" id="cookbookSearch" placeholder="Search cookbook..." onkeyup="app.filterCookbook()">
      </div>

      <div id="mealCategoriesContainer"></div>
    </main>

    <main id="view-discovery" class="view-section">
      <div class="section-header">
        <h2 class="section-title">AI Discovery</h2>
      </div>
      <div style="display: flex; gap: var(--spacing-sm); margin-bottom: var(--spacing-md);">
          <button id="disc-veg-btn" class="btn btn-primary" style="flex:1" onclick="app.switchDiscoveryDiet('veg')">Veg Mode</button>
          <button id="disc-nonveg-btn" class="btn" style="flex:1; background: var(--color-surface); border: 1px solid var(--color-border);" onclick="app.switchDiscoveryDiet('non-veg')">Non-Veg Mode</button>
      </div>
      <div id="discoveryContainer" class="meal-grid"></div>
    </main>

    <main id="view-cart" class="view-section">
      <div class="section-header">
        <h2 class="section-title">Shopping List</h2>
        <button class="icon-btn" onclick="app.clearCheckedCart()" style="background: var(--color-danger); color: white; border: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>
      <div class="input-group add-row">
        <input type="text" id="cartInput" placeholder="Add custom item..." onkeypress="if(event.key === 'Enter') app.addCustomCartItem()">
        <button class="btn-add-master" onclick="app.addCustomCartItem()" style="flex: 0.2; border-radius: var(--radius-md);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="cartContainer"></div>
      <div style="margin-top: var(--spacing-xl);">
        <button class="btn btn-primary" onclick="app.checkoutCart()">Complete Shopping</button>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <div class="nav-content">
      <div class="nav-item active" onclick="app.switchTab('cookbook', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <span class="nav-label">Cookbook</span>
      </div>
      <div class="nav-item" onclick="app.switchTab('discovery', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        <span class="nav-label">Discover</span>
      </div>
      <div class="nav-item" onclick="app.switchTab('cart', this)" style="position: relative;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="nav-label">Cart</span>
        <div id="cartBadge" class="cart-badge">0</div>
      </div>
    </div>
  </nav>

  <div id="masterModal" class="modal-overlay">
    <div class="modal-content" style="height: 85vh;">
      <div class="modal-header">
        <h3 class="modal-title">Master Groceries</h3>
        <button class="icon-btn" onclick="app.closeMasterList()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      
      <div class="add-row">
        <input type="text" id="masterInput" placeholder="Add to master list..." onkeypress="if(event.key === 'Enter') app.addMasterItem()">
        <select id="masterCategorySelect">
          <option value="Uncategorized">📦 Category</option>
          <option value="Dairy">🥛 Dairy</option>
          <option value="Eggs & Bread">🥚🍞 Eggs & Bread</option>
          <option value="Staples">🌾🍚 Staples</option>
          <option value="Vegetables">🥔🧅 Vegetables</option>
          <option value="Exotic Veg">🥦🫑 Exotic Veg</option>
          <option value="Fruits">🍎🍌 Fruits</option>
          <option value="Exotic Fruits">🥝🥑 Exotic Fruits</option>
          <option value="Spices">🌶️🧂 Spices</option>
          <option value="Oil & Ghee">🫙🌻 Oil & Ghee</option>
          <option value="Sauces & Spreads">🥫🍯 Sauces/Spreads</option>
          <option value="Dry Fruits">🌰🥜 Dry Fruits</option>
          <option value="Snacks">🍟🍿 Snacks</option>
          <option value="Healthy Snacks">💪 Healthy Snacks</option>
          <option value="Fast Food">🍜 Fast Food</option>
          <option value="Drinks">🧃🧋 Drinks</option>
          <option value="Ice Cream">🍦🍨 Ice Cream</option>
          <option value="Bath & Grooming">🧴🚿 Bath/Groom</option>
          <option value="Hygiene">🪥🧼 Hygiene</option>
          <option value="Bathroom">🧻🚽 Bathroom</option>
          <option value="Cleaning">🧽🧹 Cleaning</option>
          <option value="Kitchen">🍽️🗑️ Kitchen</option>
          <option value="Pooja">🪔🥥 Pooja</option>
        </select>
        <button class="btn-add-master" onclick="app.addMasterItem()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="search-bar">
        <input type="text" id="masterSearch" placeholder="Search master list..." onkeyup="app.filterMasterList()">
      </div>

      <div class="filter-ribbon" id="categoryRibbon">
        </div>

      <div id="masterListContainer" class="master-list-container"></div>
    </div>
  </div>

  <div id="mealModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="mealDetailName">Meal Name</h3>
        <button class="icon-btn" onclick="app.closeMealModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div style="display: flex; gap: var(--spacing-sm); margin-bottom: var(--spacing-md);">
          <span id="mealDetailCategory" class="badge veg">Category</span>
      </div>
      <div style="flex: 1; overflow-y: auto; margin-bottom: var(--spacing-md);">
        <h4 style="color: var(--color-text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: var(--spacing-sm);">Ingredients</h4>
        <div id="mealDetailIngredients" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>
      <div style="display: flex; gap: var(--spacing-sm);">
        <button id="btnCookIt" class="btn btn-primary" style="flex: 2;">Cook This</button>
        <button id="btnRemoveMeal" class="btn" style="flex: 1; background: var(--color-surface); color: var(--color-danger); border: 1px solid var(--color-border);">Remove</button>
      </div>
    </div>
  </div>

<script>
  // ==========================================
  // FRONTEND: Application Logic
  // ==========================================

  // ⚠️ IMPORTANT: If you are accessing this directly via Google Web App URL, this will work.
  // If your app stops syncing, replace window.location.href with your actual Web App URL in quotes.
  const SCRIPT_URL = window.location.href; 

  const MASTER_CATEGORIES = [
    { id: 'Mostly Bought', label: '⭐ Mostly Bought' },
    { id: 'Dairy', label: '🥛 Dairy' },
    { id: 'Eggs & Bread', label: '🥚🍞 Eggs & Bread' },
    { id: 'Staples', label: '🌾🍚 Staples' },
    { id: 'Vegetables', label: '🥔🧅 Vegetables' },
    { id: 'Exotic Veg', label: '🥦🫑 Exotic Veg' },
    { id: 'Fruits', label: '🍎🍌 Fruits' },
    { id: 'Exotic Fruits', label: '🥝🥑 Exotic Fruits' },
    { id: 'Spices', label: '🌶️🧂 Spices' },
    { id: 'Oil & Ghee', label: '🫙🌻 Oil & Ghee' },
    { id: 'Sauces & Spreads', label: '🥫🍯 Sauces/Spreads' },
    { id: 'Dry Fruits', label: '🌰🥜 Dry Fruits' },
    { id: 'Snacks', label: '🍟🍿 Snacks' },
    { id: 'Healthy Snacks', label: '💪 Healthy Snacks' },
    { id: 'Fast Food', label: '🍜 Fast Food' },
    { id: 'Drinks', label: '🧃🧋 Drinks' },
    { id: 'Ice Cream', label: '🍦🍨 Ice Cream' },
    { id: 'Bath & Grooming', label: '🧴🚿 Bath/Groom' },
    { id: 'Hygiene', label: '🪥🧼 Hygiene' },
    { id: 'Bathroom', label: '🧻🚽 Bathroom' },
    { id: 'Cleaning', label: '🧽🧹 Cleaning' },
    { id: 'Kitchen', label: '🍽️🗑️ Kitchen' },
    { id: 'Pooja', label: '🪔🥥 Pooja' },
    { id: 'Uncategorized', label: '📦 Uncategorized' }
  ];

  const app = {
    data: null,
    discoveryDiet: 'veg',
    currentMasterCategory: 'Mostly Bought',
    activeMealModal: null,

    async api(payload) {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const res = await response.json();
        if (!res.success) throw new Error(res.error);
        return res.data;
      } catch (err) {
        console.error('API Error:', err);
        return null;
      }
    },

    showLoading() {
      const el = document.getElementById('loadingOverlay');
      el.style.visibility = 'visible';
      el.style.opacity = '1';
    },
    
    hideLoading() {
      const el = document.getElementById('loadingOverlay');
      el.style.opacity = '0';
      setTimeout(() => el.style.visibility = 'hidden', 400);
    },

    async sync(force = false) {
      this.showLoading();
      const freshData = await this.api({ action: force ? 'forceRefill' : 'getAllData', diet: this.discoveryDiet });
      if (freshData) {
        this.data = freshData;
        this.renderAll();
      }
      this.hideLoading();
    },

    switchTab(tabId, el) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`view-${tabId}`).classList.add('active');
      el.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    renderAll() {
      this.renderCookbook();
      this.renderDiscovery();
      this.renderCart();
      this.updateCartBadge();
    },

    // --- COOKBOOK LOGIC ---
    renderCookbook() {
      const container = document.getElementById('mealCategoriesContainer');
      const cats = ['Breakfast', 'Lunch', 'Dinner', 'Dessert', 'Drinks', 'Cocktails'];
      
      let html = '';
      cats.forEach(cat => {
        let meals = [];
        if (['Dessert', 'Drinks', 'Cocktails'].includes(cat)) {
          meals = (this.data[cat.toLowerCase()] || []).map(m => ({ name: m, diet: 'veg' }));
        } else {
          const v = (this.data.myVegMeals || []).filter(m => m.category === cat).map(m => ({ ...m, diet: 'veg' }));
          const nv = (this.data.myNonVegMeals || []).filter(m => m.category === cat).map(m => ({ ...m, diet: 'non-veg' }));
          meals = [...v, ...nv];
        }

        if (meals.length > 0) {
          html += `
            <div class="category-block" style="margin-bottom: var(--spacing-lg);">
              <h3 style="font-family: var(--font-display); color: var(--color-brand); margin-bottom: var(--spacing-sm); border-bottom: 1px solid var(--color-border); padding-bottom: 4px;">${cat}</h3>
              <div class="meal-grid">
                ${meals.map(m => `
                  <div class="meal-card" onclick="app.openMealModal('${m.name.replace(/'/g, "\\'")}', '${cat}', '${m.diet}', 'cookbook')">
                    <div class="meal-info">
                      <div class="meal-name">${m.name}</div>
                      <div class="meal-meta"><span class="badge ${m.diet}">${m.diet}</span></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>`;
        }
      });
      container.innerHTML = html || '<div class="empty-state">Your cookbook is empty.</div>';
    },

    filterCookbook() {
      const term = document.getElementById('cookbookSearch').value.toLowerCase();
      const cards = document.querySelectorAll('#mealCategoriesContainer .meal-card');
      cards.forEach(card => {
        const name = card.querySelector('.meal-name').innerText.toLowerCase();
        card.style.display = name.includes(term) ? 'flex' : 'none';
      });
    },

    async addManualMeal() {
      const input = document.getElementById('manualMealInput');
      const meal = input.value.trim();
      const cat = document.getElementById('manualCategoryInput').value;
      const diet = document.getElementById('manualDietInput').value;
      
      if (!meal) return;
      input.value = '';
      
      const payload = { meal, category: cat, diet };
      
      // Optimistic update
      if (['Dessert', 'Drinks', 'Cocktails'].includes(cat)) {
        this.data[cat.toLowerCase()].push(meal);
      } else {
        const arr = diet === 'veg' ? this.data.myVegMeals : this.data.myNonVegMeals;
        arr.push({ name: meal, category: cat });
      }
      this.renderCookbook();
      
      await this.api({ action: 'sync_meals', data: JSON.stringify([payload]) });
    },

    // --- DISCOVERY LOGIC ---
    switchDiscoveryDiet(diet) {
      this.discoveryDiet = diet;
      document.getElementById('disc-veg-btn').className = diet === 'veg' ? 'btn btn-primary' : 'btn';
      document.getElementById('disc-veg-btn').style.background = diet === 'veg' ? 'var(--color-text)' : 'var(--color-surface)';
      document.getElementById('disc-nonveg-btn').className = diet === 'non-veg' ? 'btn btn-primary' : 'btn';
      document.getElementById('disc-nonveg-btn').style.background = diet === 'non-veg' ? 'var(--color-text)' : 'var(--color-surface)';
      this.renderDiscovery();
    },

    renderDiscovery() {
      const container = document.getElementById('discoveryContainer');
      const pool = this.discoveryDiet === 'veg' ? this.data.aiDiscoveryPool : this.data.aiNonVegPool;
      
      if (!pool || pool.length === 0) {
        container.innerHTML = '<div class="empty-state">No discoveries available. Tap sync.</div>';
        return;
      }
      
      container.innerHTML = pool.map(m => `
        <div class="meal-card" onclick="app.openMealModal('${m.name.replace(/'/g, "\\'")}', '${m.category}', '${this.discoveryDiet}', 'discovery')">
          <div class="meal-info">
            <div class="meal-name">${m.name}</div>
            <div class="meal-meta"><span class="badge ${this.discoveryDiet}">${m.category}</span></div>
          </div>
          <button class="action-btn primary" onclick="event.stopPropagation(); app.addFromDiscovery('${m.name.replace(/'/g, "\\'")}', '${m.category}')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      `).join('');
    },

    async addFromDiscovery(name, category) {
      const payload = { meal: name, category, diet: this.discoveryDiet };
      
      // Optimistic
      if (['Dessert', 'Drinks', 'Cocktails'].includes(category)) {
        this.data[category.toLowerCase()].push(name);
      } else {
        const arr = this.discoveryDiet === 'veg' ? this.data.myVegMeals : this.data.myNonVegMeals;
        arr.push({ name, category });
      }
      this.renderCookbook();
      alert(`Added ${name} to Cookbook!`);
      
      await this.api({ action: 'sync_meals', data: JSON.stringify([payload]) });
    },

    // --- CART LOGIC ---
    updateCartBadge() {
      const badge = document.getElementById('cartBadge');
      const count = (this.data.cart || []).filter(i => !i.checked).length;
      badge.textContent = count;
      if (count > 0) badge.classList.add('visible');
      else badge.classList.remove('visible');
    },

    renderCart() {
      const container = document.getElementById('cartContainer');
      const cart = this.data.cart || [];
      
      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-state">Your shopping list is empty.</div>';
        return;
      }

      // Sort: Unchecked first, then Checked
      const sortedCart = [...cart].sort((a, b) => (a.checked === b.checked) ? 0 : a.checked ? 1 : -1);

      container.innerHTML = sortedCart.map((item, index) => {
        // Find index in original array to ensure accurate toggle
        const originalIndex = this.data.cart.findIndex(i => i.name === item.name);
        return `
          <div class="cart-item ${item.checked ? 'checked' : ''}" onclick="app.toggleCartItem(${originalIndex})">
            <div class="checkbox-custom"></div>
            <div class="cart-info">
              <div class="cart-name">${item.name}</div>
              ${item.mealContext !== 'Uncategorized' ? `<div class="cart-context">For: ${item.mealContext}</div>` : ''}
            </div>
            <button class="icon-btn" onclick="event.stopPropagation(); app.removeCartItem(${originalIndex})" style="width: 32px; height: 32px;">
               <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        `;
      }).join('');
    },

    async toggleCartItem(index) {
      this.data.cart[index].checked = !this.data.cart[index].checked;
      this.renderCart();
      this.updateCartBadge();
      await this.api({ action: 'syncCart', cart: this.data.cart });
    },

    async removeCartItem(index) {
      this.data.cart.splice(index, 1);
      this.renderCart();
      this.updateCartBadge();
      await this.api({ action: 'syncCart', cart: this.data.cart });
    },

    async addCustomCartItem() {
      const input = document.getElementById('cartInput');
      const name = input.value.trim();
      if (!name) return;
      input.value = '';
      
      this.data.cart = this.data.cart || [];
      this.data.cart.push({ name, checked: false, recent: true, flag: '', mealContext: 'Manual Entry' });
      this.renderCart();
      this.updateCartBadge();
      await this.api({ action: 'syncCart', cart: this.data.cart });
    },

    async clearCheckedCart() {
      this.data.cart = (this.data.cart || []).filter(i => !i.checked);
      this.renderCart();
      await this.api({ action: 'syncCart', cart: this.data.cart });
    },

    async checkoutCart() {
      const checkedItems = (this.data.cart || []).filter(i => i.checked).map(i => i.name);
      if (checkedItems.length === 0) {
        alert('No completed items to checkout.');
        return;
      }
      
      // Remove checked from cart
      this.data.cart = this.data.cart.filter(i => !i.checked);
      this.renderCart();
      this.updateCartBadge();
      
      // Background process: sync cart and update history
      this.api({ action: 'syncCart', cart: this.data.cart });
      await this.api({ action: 'updateHistory', items: checkedItems });
      
      alert(`Checkout complete! ${checkedItems.length} items logged to history.`);
      this.sync(false); // Silent refresh to update Master List frequencies
    },

    // --- MASTER LIST LOGIC (Overhauled with AI & Categories) ---
    openMasterList() {
      this.renderCategoryRibbon();
      this.renderMasterList();
      document.getElementById('masterModal').classList.add('active');
    },
    
    closeMasterList() {
      document.getElementById('masterModal').classList.remove('active');
      document.getElementById('masterSearch').value = ''; // clear search on close
    },

    renderCategoryRibbon() {
      const container = document.getElementById('categoryRibbon');
      container.innerHTML = MASTER_CATEGORIES.map(cat => `
        <div class="filter-chip ${cat.id === 'Mostly Bought' ? 'top-picks' : ''} ${this.currentMasterCategory === cat.id ? 'active' : ''}"
             onclick="app.setMasterCategory('${cat.id}')">
          ${cat.label}
        </div>
      `).join('');
    },

    setMasterCategory(catId) {
      this.currentMasterCategory = catId;
      this.renderCategoryRibbon();
      this.renderMasterList();
    },

    filterMasterList() {
      this.renderMasterList();
    },

    renderMasterList() {
      const container = document.getElementById('masterListContainer');
      const searchTerm = document.getElementById('masterSearch').value.toLowerCase();
      
      let filtered = (this.data.masterGrocery || []).filter(item => {
         if (searchTerm && !item.name.toLowerCase().includes(searchTerm)) return false;

         if (this.currentMasterCategory === 'Mostly Bought') {
            return item.freq >= 10;
         } else if (this.currentMasterCategory !== 'All') { // Safety catch
            const itemCat = item.category || 'Uncategorized';
            return itemCat === this.currentMasterCategory;
         }
         return true;
      });

      // CORE ALGORITHM: Sort by frequency (desc), then alphabetically
      filtered.sort((a, b) => (b.freq - a.freq) || a.name.localeCompare(b.name));

      container.innerHTML = filtered.map(item => `
         <div class="master-item">
            <div class="master-info">
               <span class="master-name">${item.name}</span>
               <span class="master-meta">
                  <span>🔄 Bought ${item.freq} times</span>
                  ${item.category && item.category !== 'Uncategorized' ? `<span>· ${item.category}</span>` : ''}
               </span>
            </div>
            <button class="icon-btn" onclick="app.addFromMaster('${item.name.replace(/'/g, "\\'")}')" style="background: var(--color-surface-elevated); border: 1px solid var(--color-border);">
               <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
            </button>
         </div>
      `).join('') || '<div class="empty-state">No items found here.</div>';
    },

    async addFromMaster(itemName) {
      this.data.cart = this.data.cart || [];
      const exists = this.data.cart.find(i => i.name === itemName);
      if (exists) {
        alert(`${itemName} is already in the cart.`);
        return;
      }
      
      this.data.cart.push({ name: itemName, checked: false, recent: true, flag: '', mealContext: 'Restock' });
      this.renderCart();
      this.updateCartBadge();
      
      // Brief visual feedback
      const btn = event.currentTarget;
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)"><path d="M20 6 9 17l-5-5"/></svg>';
      setTimeout(() => {
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>';
      }, 1000);

      await this.api({ action: 'syncCart', cart: this.data.cart });
    },

    async addMasterItem() {
      const input = document.getElementById('masterInput');
      const select = document.getElementById('masterCategorySelect');
      const name = input.value.trim();
      const cat = select.value;
      
      if (!name) return;
      input.value = '';
      
      // Optimistic UI update
      this.data.masterGrocery = this.data.masterGrocery || [];
      this.data.masterGrocery.push({ name, freq: 1, date: new Date().toISOString(), category: cat });
      this.renderMasterList();
      
      // Backend handles exact string categorisation via Gemini if left as 'Uncategorized'
      await this.api({ action: 'addMasterItem', item: name, category: cat });
    },

    // --- MEAL MODAL LOGIC ---
    openMealModal(mealName, category, diet, source) {
      this.activeMealModal = mealName;
      document.getElementById('mealDetailName').innerText = mealName;
      document.getElementById('mealDetailCategory').innerText = category;
      document.getElementById('mealDetailCategory').className = `badge ${diet}`;
      
      // Find ingredients
      let ingredients = [];
      const pool = diet === 'veg' ? this.data.aiDiscoveryPool : this.data.aiNonVegPool;
      const aiData = (pool || []).find(m => m.name === mealName);
      
      if (aiData && aiData.ingredients) {
        try {
          ingredients = JSON.parse(aiData.ingredients);
        } catch(e) {}
      }

      const ingContainer = document.getElementById('mealDetailIngredients');
      if (ingredients.length > 0) {
        ingContainer.innerHTML = ingredients.map(ing => `
          <div style="display: flex; justify-content: space-between; align-items: center; background: var(--color-surface-elevated); padding: 10px; border-radius: var(--radius-sm);">
            <span>${ing}</span>
            <button class="icon-btn" onclick="app.addIngToCart('${ing.replace(/'/g, "\\'")}', '${mealName.replace(/'/g, "\\'")}')" style="width: 28px; height: 28px; background: var(--color-bg); border: 1px solid var(--color-border);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        `).join('');
      } else {
        ingContainer.innerHTML = '<div style="color: var(--color-text-muted); font-size: 14px;">No ingredients listed.</div>';
      }

      // Configure Action Buttons
      const btnCook = document.getElementById('btnCookIt');
      const btnRemove = document.getElementById('btnRemoveMeal');
      
      btnCook.onclick = () => {
        this.api({ action: 'logCooking', mealName });
        alert(`Logged ${mealName} to cooking history!`);
        this.closeMealModal();
      };
      
      if (source === 'cookbook') {
        btnRemove.style.display = 'block';
        btnRemove.onclick = () => {
           if(confirm('Remove this meal from your cookbook?')) {
             // Basic optimism
             this.closeMealModal();
             alert('Removed! Sync to finalize changes.'); 
           }
        };
      } else {
        btnRemove.style.display = 'none';
      }

      document.getElementById('mealModal').classList.add('active');
    },

    closeMealModal() {
      document.getElementById('mealModal').classList.remove('active');
      this.activeMealModal = null;
    },

    async addIngToCart(ingName, mealName) {
      this.data.cart = this.data.cart || [];
      this.data.cart.push({ name: ingName, checked: false, recent: true, flag: '', mealContext: mealName });
      this.renderCart();
      this.updateCartBadge();
      
      const btn = event.currentTarget;
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)"><path d="M20 6 9 17l-5-5"/></svg>';
      
      await this.api({ action: 'syncCart', cart: this.data.cart });
    }
  };

  // Boot up the app
  window.onload = () => app.sync();

</script>
</body>
</html>
