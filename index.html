<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>MealSync</title>
  <meta name="theme-color" content="#000000" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=boska@400,500,700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    :root {
      --color-bg: #000000; --color-surface: #121110; --color-surface-2: #1a1918; --color-surface-offset: #22201e; 
      --color-border: rgba(255, 255, 255, 0.05); --color-divider: rgba(255, 255, 255, 0.08); 
      --color-text: #e8e6e3; --color-text-muted: #918f8b; 
      --color-primary: #80c7d2; --color-secondary: #e6c57a; --color-success: #78a85d; --color-warning: #e39d5b; --color-error: #c975ae;
      --font-body: 'General Sans', sans-serif; --font-display: 'Boska', serif;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); padding-bottom: 120px; overflow-x: hidden; }
    button, input, select { font: inherit; color: inherit; outline: none; background: none; border: none; cursor: pointer; }
    
    .topbar { position: fixed; top: 0; width: 100%; padding: 1.5rem 1rem; z-index: 40; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, #000 70%, transparent); }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); display: grid; place-items: center; color: #000; font-weight: bold; }
    h1 { font-family: var(--font-display); font-size: 1.75rem; }
    
    .shell { padding: 6rem 1rem 8rem; max-width: 600px; margin: 0 auto; }
    .page { display: none; animation: fadePeek 0.4s var(--ease-spring); }
    .page.active { display: block; }
    @keyframes fadePeek { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* CART UI */
    .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--color-text-muted); font-weight: bold; margin: 24px 0 12px; }
    .swipe-wrapper { position: relative; overflow: hidden; margin-bottom: 12px; border-radius: 1.5rem; }
    .swipe-bg { position: absolute; inset: 0; background: var(--color-error); border-radius: 1.5rem; display: flex; align-items: center; justify-content: flex-end; padding-right: 24px; color: #fff; font-weight: bold; }
    .swipe-item { position: relative; z-index: 1; transition: transform 0.2s; background: var(--color-surface); padding: 16px; border-radius: 1.5rem; border: 1px solid var(--color-border); display: flex; align-items: center; }
    .swipe-item.dimmed { opacity: 0.5; background: transparent; }
    .checkbox { width: 24px; height: 24px; border: 2px solid var(--color-primary); border-radius: 8px; margin-right: 16px; display: flex; align-items: center; justify-content: center; color: transparent; transition: all 0.2s; }
    .swipe-item.checked .checkbox { background: var(--color-primary); color: var(--color-bg); }
    .item-details { flex-grow: 1; display: flex; align-items: center; justify-content: space-between; }
    .item-name { font-size: 18px; font-weight: 600; text-transform: capitalize; }
    .item-flag { font-size: 12px; color: var(--color-warning); font-weight: 600; }
    .qty-badge { background: color-mix(in oklab, var(--color-primary) 15%, transparent); color: var(--color-primary); padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: bold; }
    
    .primary-btn { background: var(--color-primary); color: var(--color-bg); width: 100%; padding: 18px; border-radius: 1.5rem; font-size: 18px; font-weight: bold; margin-top: 12px; box-shadow: 0 8px 20px rgba(128,199,210,0.3); }

    /* MEAL CARDS */
    .meal-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 2rem; padding: 1.5rem; margin-bottom: 1.5rem; position: relative; }
    .card-head { display: flex; justify-content: space-between; margin-bottom: 1rem; }
    .eyebrow { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; background: rgba(120,168,93,0.15); color: var(--color-success); border: 1px solid rgba(120,168,93,0.3); }
    .badge.warning { background: rgba(227,157,91,0.15); color: var(--color-warning); border-color: rgba(227,157,91,0.3); }
    .card-actions-top { display: flex; gap: 10px; }
    .icon-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--color-surface-2); display: flex; align-items: center; justify-content: center; border: 1px solid var(--color-border); transition: 0.2s; }
    .icon-circle.active { background: rgba(120,168,93,0.2); color: var(--color-success); border-color: var(--color-success); }
    
    .meal-title { font-family: var(--font-display); font-size: 2.2rem; font-weight: 600; line-height: 1.1; margin-bottom: 1.5rem; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .btn-card { padding: 14px; border-radius: 1rem; background: var(--color-surface-2); border: 1px solid var(--color-border); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-card.active { background: var(--color-success); color: var(--color-bg); border-color: var(--color-success); }
    
    .explore-menu { max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s; display: flex; justify-content: space-around; background: var(--color-surface-2); border-radius: 1rem; }
    .explore-menu.open { max-height: 100px; opacity: 1; padding: 15px; margin-top: 10px; border: 1px solid var(--color-border); }
    .explore-icon { width: 45px; height: 45px; border-radius: 50%; background: var(--color-surface); display: flex; align-items: center; justify-content: center; border: 1px solid var(--color-border); }

    /* FLOATING NAV */
    .split-nav { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; z-index: 1000; }
    .nav-pill { background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); border-radius: 30px; display: flex; align-items: center; padding: 8px 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); border: 1px solid var(--color-border); }
    .nav-btn { padding: 10px; border-radius: 50%; color: var(--color-text-muted); transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .nav-btn.active { color: var(--color-primary); background: rgba(128,199,210,0.1); }
    .btn-autoplan { background: linear-gradient(135deg, #FF416C, #FF4B2B); color: white !important; margin: 0 10px; transform: scale(1.1); box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4); }
    .btn-autoplan:active { transform: scale(1); }

    /* MODALS & BOTTOM SHEETS */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    .modal.open { display: flex; }
    .dialog { background: var(--color-surface); width: 100%; max-width: 500px; max-height: 85vh; border-radius: 2rem; border: 1px solid var(--color-border); display: flex; flex-direction: column; overflow: hidden; }
    .dialog-head { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); }
    .dialog-body { padding: 20px; overflow-y: auto; }
    
    .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: var(--color-surface); border-radius: 2rem 2rem 0 0; padding: 2rem 1.5rem 6rem; transition: bottom 0.3s; z-index: 2001; border-top: 1px solid var(--color-border); }
    .bottom-sheet.active { bottom: 0; }
    .unit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }

    /* INGEST ENGINE */
    .upload-area { border: 2px dashed var(--color-border); border-radius: 1.5rem; padding: 20px; text-align: center; background: var(--color-surface-2); }
    .input { width: 100%; padding: 14px; border-radius: 1rem; border: 1px solid var(--color-border); background: var(--color-bg); }
    
    .loader { position: fixed; inset: 0; background: var(--color-bg); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { border: 4px solid var(--color-surface-2); border-top: 4px solid var(--color-primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  
  <div class="loader" id="mainLoader">
    <div class="spinner"></div>
    <h2 style="font-family: var(--font-display);">Syncing Database...</h2>
  </div>

  <div class="topbar">
    <div class="brand"><div class="brand-logo">MS</div><h1>MealSync</h1></div>
    <button class="btn-card" style="padding: 8px 16px; border-radius: 20px; font-size: 12px;" onclick="openCookBook()">+ Ingest Engine</button>
  </div>

  <div class="shell">
    
    <div id="page-cart" class="page active">
      <h2 style="font-family:var(--font-display); font-size:2.5rem; margin-bottom: 10px;">Grocery Cart</h2>
      
      <div class="section-title">Ready to Buy</div>
      <div id="active-items"></div>
      
      <div class="section-title" style="margin-top: 30px;">Recently Bought</div>
      <div id="dimmed-items"></div>
      
      <button class="primary-btn" onclick="startGuidedShopping()" style="margin-top: 30px;">🛒 Start Guided Shopping</button>
      <button class="btn-card" style="width: 100%; padding: 18px; margin-top: 12px;" onclick="repeatLastOrder()">↺ Repeat Last Staples Order</button>
    </div>

    <div id="page-plan" class="page">
      <h2 style="font-family:var(--font-display); font-size:2.5rem; margin-bottom: 20px;">Plan Your Day</h2>
      <div id="deck"></div>
    </div>

  </div>

  <div class="split-nav">
    <div class="nav-pill">
      <button class="nav-btn active" id="nav-cart" onclick="switchTab('cart')">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm7 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-9.8-2h11.2a2 2 0 0 0 1.9-1.4l2.4-7.6A1 1 0 0 0 21 8H6.5l-.8-3.4A2 2 0 0 0 3.8 3H2v2h1.8l3.6 14.5A2 2 0 0 0 9.2 21h8.6"/></svg>
      </button>
    </div>
    <div class="nav-pill" style="gap: 10px;">
      <button class="nav-btn" onclick="triggerFridgeMatch()">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><line x1="3" y1="9" x2="17" y2="9"/><circle cx="16" cy="16" r="5"/></svg>
      </button>
      <button class="nav-btn btn-autoplan" id="nav-plan" onclick="switchTab('plan')">
        <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><path d="M12 2v4 M12 18v4 M2 12h4 M18 12h4"/></svg>
      </button>
      <button class="nav-btn" onclick="triggerChefSpecial()">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20 M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </button>
    </div>
  </div>

  <div class="modal" id="picker-overlay" onclick="closePicker()" style="background:rgba(0,0,0,0.5);"></div>
  <div class="bottom-sheet" id="bottom-sheet">
    <h2 id="picker-title" style="text-align: center; font-family:var(--font-display);">Select Quantity</h2>
    <div class="unit-grid" id="picker-grid"></div>
  </div>

  <div class="modal" id="dataModal">
    <div class="dialog">
      <div class="dialog-head"><h4 style="font-family:var(--font-display); font-size:24px;">Ingest Engine</h4><button onclick="document.getElementById('dataModal').classList.remove('open')">✕</button></div>
      <div class="dialog-body">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
          <label class="upload-area"><div style="font-size:24px; margin-bottom:5px;">📄</div><div style="font-weight:bold;">Document</div><input type="file" style="display:none" accept=".pdf,.docx,image/*" onchange="processFile(event)"></label>
          <label class="upload-area"><div style="font-size:24px; margin-bottom:5px;">📷</div><div style="font-weight:bold;">Scan</div><input type="file" style="display:none" accept="image/*" capture="environment" onchange="processFile(event)"></label>
        </div>
        <p id="parseStatus" style="text-align:center; color:var(--color-primary); font-weight:bold; display:none;">Extracting text...</p>
        
        <div style="display:flex; gap:10px; margin-bottom:20px;">
          <input id="manualInput" class="input" placeholder="e.g. Palak Paneer">
          <select id="manualCat" class="input" style="width:100px; padding:10px;"><option>Breakfast</option><option>Lunch</option><option>Dinner</option></select>
          <button class="btn-card" style="background:var(--color-primary); color:#000;" onclick="queueManual()">Add</button>
        </div>

        <div id="queueSection" style="display:none; background:var(--color-surface-2); padding:15px; border-radius:1rem; border:1px solid var(--color-success); margin-bottom:20px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><h5 style="color:var(--color-success);">Pending Queue</h5><button onclick="syncQueue()" style="color:var(--color-success); font-weight:bold;">Sync to DB</button></div>
          <div id="queueList" style="display:grid; gap:10px;"></div>
        </div>
        
        <div class="section-title">Database Overview</div>
        <div id="dbStats" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; text-align:center;"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwvU930ksyyrtTkhXbzOehjo3uh9J1qViq77I_WRPvg25rMNzClScK1MY758xlaDzRRSQ/exec";
    
    // Core State
    let state = {
      db: { Breakfast: [], Lunch: [], Dinner: [] },
      master: [], history: [], cart: [], pending: [],
      eaten: { Breakfast: null, Lunch: null, Dinner: null },
      deck: { Breakfast: 0, Lunch: 0, Dinner: 0 }
    };

    // INIT
    window.onload = () => {
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getAllData' }) })
        .then(res => res.json())
        .then(res => {
          state.db.Breakfast = res.data.breakfast.length ? res.data.breakfast : ['Idli'];
          state.db.Lunch = res.data.lunch.length ? res.data.lunch : ['Dal Rice'];
          state.db.Dinner = res.data.dinner.length ? res.data.dinner : ['Khichdi'];
          state.master = res.data.masterGrocery;
          state.history = res.data.orderHistory;
          state.cart = res.data.cart;
          document.getElementById('mainLoader').style.display = 'none';
          renderCart();
          renderDeck();
        }).catch(err => {
          document.getElementById('mainLoader').style.display = 'none';
          alert("Failed to connect to Database. Running in local fallback mode.");
          renderCart(); renderDeck();
        });
    };

    // NAVIGATION
    function switchTab(tab) {
      if(navigator.vibrate) navigator.vibrate(15);
      document.querySelectorAll('.page, .nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`page-${tab}`).classList.add('active');
      document.getElementById(`nav-${tab}`).classList.add('active');
      if(tab === 'plan') {
         // Cycle randomly on entering plan view to simulate "Auto Plan"
         state.deck.Breakfast = Math.floor(Math.random() * state.db.Breakfast.length);
         state.deck.Lunch = Math.floor(Math.random() * state.db.Lunch.length);
         state.deck.Dinner = Math.floor(Math.random() * state.db.Dinner.length);
         renderDeck();
      }
    }

    // UI RENDERERS
    function renderDeck() {
      const container = document.getElementById('deck');
      container.innerHTML = '';
      ['Breakfast', 'Lunch', 'Dinner'].forEach(cat => {
        const mealName = state.db[cat][state.deck[cat]] || "No Meals";
        const isEaten = state.eaten[cat] === mealName;
        const tag = ['chicken','fish','mutton','meat'].some(k => mealName.toLowerCase().includes(k)) ? 'Non-Veg' : 'Veg';
        
        container.innerHTML += `
          <div class="meal-card">
            <div class="card-head">
              <div class="eyebrow">${cat} <span class="badge ${tag === 'Veg' ? '' : 'warning'}">${tag}</span></div>
              <div class="card-actions-top">
                <button class="icon-circle" id="bm-${cat}" onclick="toggleBookmark('${mealName}', '${cat}')"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
                <button class="icon-circle" onclick="breakdownToCart('${mealName}')"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm7 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-9.8-2h11.2a2 2 0 0 0 1.9-1.4l2.4-7.6A1 1 0 0 0 21 8H6.5l-.8-3.4A2 2 0 0 0 3.8 3H2v2h1.8l3.6 14.5A2 2 0 0 0 9.2 21h8.6"/></svg></button>
              </div>
            </div>
            <div class="meal-title">${mealName}</div>
            
            <div class="grid-2">
              <button class="btn-card" onclick="cycleMeal('${cat}', -1)">« Prev</button>
              <button class="btn-card" onclick="cycleMeal('${cat}', 1)">Next »</button>
            </div>
            <div class="grid-2">
              <button class="btn-card ${isEaten ? 'active' : ''}" onclick="toggleEaten('${cat}', '${mealName}')">${isEaten ? '✓ Logged' : 'Order Up!'}</button>
              <button class="btn-card" onclick="document.getElementById('exp-${cat}').classList.toggle('open')">🔗 Explore</button>
            </div>
            
            <div class="explore-menu" id="exp-${cat}">
              <button class="explore-icon" onclick="window.open('https://google.com/search?q=${mealName} recipe', '_blank')"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 24c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 21.53 7.7 24 12 24z"/><path fill="#FBBC05" d="M5.84 15.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V8.06H2.18C1.43 9.55 1 11.22 1 13s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 4.84c1.61 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.63 14.97 0 12 0 7.7 0 3.99 2.47 2.18 6.06l3.66 2.84c.87-2.6 3.3-4.06 6.16-4.06z"/></svg></button>
              <button class="explore-icon" onclick="window.open('https://youtube.com/results?search_query=${mealName} recipe', '_blank')"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="#FF0000" d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg></button>
              <button class="explore-icon" onclick="navigator.share({title:'MealSync', text:'Check out this recipe for ${mealName}!'})"><svg width="24" height="24" fill="none" stroke="#fff" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>
              <button class="explore-icon" onclick="window.open('https://google.com/search?q=${mealName} nutritional value', '_blank')"><svg width="24" height="24" fill="none" stroke="#80c7d2" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></button>
            </div>
          </div>
        `;
      });
    }

    function cycleMeal(cat, dir) {
      if(navigator.vibrate) navigator.vibrate(10);
      let newIdx = state.deck[cat] + dir;
      if (newIdx < 0) newIdx = state.db[cat].length - 1;
      if (newIdx >= state.db[cat].length) newIdx = 0;
      state.deck[cat] = newIdx;
      renderDeck();
    }

    function toggleEaten(cat, meal) {
      if(navigator.vibrate) navigator.vibrate(15);
      state.eaten[cat] = state.eaten[cat] === meal ? null : meal;
      renderDeck();
    }

    function toggleBookmark(meal, cat) {
      if(navigator.vibrate) navigator.vibrate(15);
      const icon = document.getElementById(`bm-${cat}`);
      const exists = state.pending.findIndex(p => p.name === meal);
      if(exists > -1) { state.pending.splice(exists, 1); icon.classList.remove('active'); }
      else { state.pending.push({name: meal, category: cat}); icon.classList.add('active'); }
    }

    // CART & INVENTORY LOGIC
    function renderCart() {
      let active = '', dimmed = '';
      state.cart.forEach((item, i) => {
        const html = `
          <div class="swipe-wrapper" id="sw-${i}" ontouchstart="ts(event,${i})" ontouchmove="tm(event,${i})" ontouchend="te(event,${i})">
            <div class="swipe-bg">Delete</div>
            <div class="swipe-item ${item.checked ? 'checked' : ''} ${item.recent && !item.checked ? 'dimmed' : ''}" onclick="toggleCart(${i})">
              <div class="checkbox">✓</div>
              <div class="item-details">
                <div><div class="item-name">${item.name}</div>${item.flag ? `<div class="item-flag">🕒 ${item.flag}</div>` : ''}</div>
                <div class="qty-badge" onclick="openPicker(event, ${i})">${item.quantity} ▾</div>
              </div>
            </div>
          </div>`;
        if (item.recent && !item.checked) dimmed += html; else active += html;
      });
      document.getElementById('active-items').innerHTML = active || '<p class="subtle">Nothing active.</p>';
      document.getElementById('dimmed-items').innerHTML = dimmed || '<p class="subtle">No recent history.</p>';
    }

    function toggleCart(i) { if(navigator.vibrate) navigator.vibrate(15); state.cart[i].checked = !state.cart[i].checked; renderCart(); syncCart(); }
    
    // PANTRY-AWARE AI BREAKDOWN
    function breakdownToCart(meal) {
      if(navigator.vibrate) navigator.vibrate(15);
      const loader = document.getElementById('mainLoader');
      loader.querySelector('h2').innerText = "Analyzing Pantry...";
      loader.style.display = 'flex';

      const historyKeys = state.history.map(h => h.item.toLowerCase());

      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'breakdownRecipe', mealName: meal }) })
        .then(res => res.json())
        .then(res => {
          loader.style.display = 'none';
          const items = res.data || [];
          items.reverse().forEach(ing => {
            if(!state.cart.some(c => c.name.toLowerCase() === ing.name.toLowerCase())) {
               // 7-Day Logic
               const boughtRecently = historyKeys.includes(ing.name.toLowerCase());
               state.cart.unshift({
                 name: ing.name, quantity: ing.quantity, unit: ing.unit,
                 checked: !boughtRecently, recent: boughtRecently, flag: boughtRecently ? "Bought < 7 Days" : ""
               });
            }
          });
          syncCart(); switchTab('cart'); renderCart();
        }).catch(e => { loader.style.display = 'none'; alert("Failed API Call"); });
    }

    // SMART REPEAT ORDER
    function repeatLastOrder() {
       if(navigator.vibrate) navigator.vibrate(15);
       const now = new Date();
       // Get items bought in last 7 days
       const recentItems = state.history.filter(h => (now - new Date(h.date)) < 7*24*60*60*1000).map(h => h.item.toLowerCase());
       
       let addedCount = 0;
       state.master.forEach(m => {
           if(recentItems.includes(m.name.toLowerCase())) {
               if(!state.cart.some(c => c.name.toLowerCase() === m.name.toLowerCase())) {
                   state.cart.unshift({ name: m.name, quantity: m.lastQty, unit: m.unitType, checked: true, recent: false, flag: "Restock" });
                   addedCount++;
               }
           }
       });
       if(addedCount > 0) { syncCart(); renderCart(); } else { alert("No recent staples found to restock."); }
    }

    // QUANTITY PICKER
    function getOpts(unit) {
      if (unit === 'Weight') return ['100g', '250g', '500g', '1kg', '2kg'];
      if (unit === 'Volume') return ['250ml', '500ml', '1L', '2L'];
      return ['1', '2', '6', '1 Dozen']; 
    }
    let editIdx = null;
    function openPicker(e, i) {
      e.stopPropagation(); if(navigator.vibrate) navigator.vibrate(15);
      editIdx = i; const item = state.cart[i];
      document.getElementById('picker-title').innerText = item.name;
      document.getElementById('picker-grid').innerHTML = getOpts(item.unit).map(o => `<button class="btn-card" onclick="setQty('${o}')">${o}</button>`).join('');
      document.getElementById('picker-overlay').classList.add('open');
      document.getElementById('bottom-sheet').classList.add('active');
    }
    function setQty(q) { state.cart[editIdx].quantity = q; closePicker(); renderCart(); syncCart(); }
    function closePicker() { document.getElementById('picker-overlay').classList.remove('open'); document.getElementById('bottom-sheet').classList.remove('active'); }

    // SWIPE TO DELETE
    let tx=0, cx=0, sid=null;
    function ts(e,id) { tx=e.touches[0].clientX; sid=id; document.getElementById(`sw-${id}`).style.transition='none'; }
    function tm(e,id) { if(sid!==id) return; let dx=e.touches[0].clientX-tx; if(dx<0) { cx=dx; document.getElementById(`sw-${id}`).children[1].style.transform=`translateX(${cx}px)`; } }
    function te(e,id) {
      if(sid!==id) return; sid=null; const el=document.getElementById(`sw-${id}`).children[1]; el.style.transition='0.2s';
      if(cx < -80) { el.style.transform=`translateX(-100%)`; setTimeout(()=>deleteCartItem(id), 200); }
      else el.style.transform=`translateX(0)`; cx=0;
    }
    function deleteCartItem(id) { state.cart.splice(id,1); renderCart(); syncCart(); }

    function syncCart() { fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncCart', cart: state.cart }) }); }

    // INGEST ENGINE
    function openCookBook() {
      document.getElementById('dbStats').innerHTML = `
        <div class="btn-card" style="flex-direction:column; padding:20px;"><div>BF</div><h3>${state.db.Breakfast.length}</h3></div>
        <div class="btn-card" style="flex-direction:column; padding:20px;"><div>LCH</div><h3>${state.db.Lunch.length}</h3></div>
        <div class="btn-card" style="flex-direction:column; padding:20px;"><div>DIN</div><h3>${state.db.Dinner.length}</h3></div>`;
      document.getElementById('dataModal').classList.add('open');
    }

    function queueManual() {
      const name = document.getElementById('manualInput').value.trim();
      const cat = document.getElementById('manualCat').value;
      if(name) { state.pending.push({name, category: cat}); document.getElementById('manualInput').value=''; renderQueue(); }
    }

    function processFile(event) {
      const file = event.target.files[0]; if (!file) return;
      document.getElementById('parseStatus').style.display = 'block';
      const fr = new FileReader();
      if (file.type.match('image.*')) {
        fr.onload = () => Tesseract.recognize(fr.result, 'eng').then(({ data: { text } }) => parseTxt(text));
        fr.readAsDataURL(file);
      } else if (file.name.endsWith('.pdf')) {
        fr.onload = function() {
          pdfjsLib.getDocument(new Uint8Array(this.result)).promise.then(pdf => {
            let p = []; for(let j=1; j<=pdf.numPages; j++) p.push(pdf.getPage(j).then(page => page.getTextContent().then(t => t.items.map(s => s.str).join(' '))));
            Promise.all(p).then(txt => parseTxt(txt.join(' ')));
          });
        }; fr.readAsArrayBuffer(file);
      } else if (file.name.endsWith('.docx')) {
        fr.onload = (e) => mammoth.extractRawText({ arrayBuffer: e.target.result }).then(res => parseTxt(res.value));
        fr.readAsArrayBuffer(file);
      }
    }
    
    function parseTxt(txt) {
      document.getElementById('parseStatus').style.display = 'none';
      txt.split(/[\n,;.]+/).forEach(l => { const cl = l.replace(/[^a-zA-Z0-9\s&]/g, '').trim(); if(cl.length>4 && cl.length<45) state.pending.push({name:cl, category:'Lunch'}); });
      renderQueue();
    }

    function renderQueue() {
      const q = document.getElementById('queueSection'); const l = document.getElementById('queueList');
      if(state.pending.length===0) { q.style.display='none'; return; }
      q.style.display='block'; l.innerHTML='';
      state.pending.forEach((p,i) => {
        l.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; background:var(--color-surface); padding:10px; border-radius:10px;">
          <select style="background:var(--color-surface-2); padding:5px; border-radius:5px;" onchange="state.pending[${i}].category=this.value"><option ${p.category==='Breakfast'?'selected':''}>Breakfast</option><option ${p.category==='Lunch'?'selected':''}>Lunch</option><option ${p.category==='Dinner'?'selected':''}>Dinner</option></select>
          <b>${p.name}</b> <button onclick="state.pending.splice(${i},1); renderQueue()" style="color:var(--color-error)">✕</button></div>`;
      });
    }

    function syncQueue() {
      if(state.pending.length===0) return;
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncPendingQueue', items: state.pending }) }).then(() => { state.pending=[]; document.getElementById('dataModal').classList.remove('open'); alert("Synced to DB."); location.reload(); });
    }

    // EXTRA TRIGGERS
    function triggerFridgeMatch() { alert("Fridge Match Modal functionality ready to mount."); }
    function triggerChefSpecial() {
       const meal = ["Pesto Pasta", "Vegetable Hakka Noodles", "Paneer Tikka Masala"][Math.floor(Math.random()*3)];
       state.deck.Dinner = state.db.Dinner.length; state.db.Dinner.push(meal); renderDeck(); alert("Chef found a special meal: " + meal);
    }
    function startGuidedShopping() {
       const q = state.cart.filter(c => c.checked);
       if(q.length===0) return alert("Check items to shop.");
       fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateHistory', items: q }) });
       window.location.href = `swiggy://instamart/search?query=${encodeURIComponent(q[0].name)}`;
    }
  </script>
</body>
</html>
