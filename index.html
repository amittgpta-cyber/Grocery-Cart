<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Grocery List</title>
    <style>
        :root {
            --primary-color: #2E7D32;
            --bg-selected: #E8F5E9;
            --ai-text: #1976D2;
            --btn-bg: #4CAF50;
            --text-main: #333333;
            --text-muted: #757575;
            --border-color: #eeeeee;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f5f5f5;
            color: var(--text-main);
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 16px;
            margin-top: 32px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .list-item-container {
            border-bottom: 1px solid var(--border-color);
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .list-item-container.selected {
            background-color: var(--bg-selected);
        }

        .list-item-container.selected .item-name {
            color: var(--primary-color);
        }

        .icon-container {
            width: 28px;
            height: 28px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 18px;
        }

        .item-details {
            flex-grow: 1;
        }

        .item-name {
            font-size: 16px;
            font-weight: 500;
        }

        .item-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .quantity-selector {
            padding: 0 16px 16px 56px;
            display: none;
        }

        .list-item-container.selected .quantity-selector {
            display: block;
        }

        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
            width: 150px;
        }

        .ai-reason { color: var(--ai-text); }

        .bookmark-btn {
            background: none;
            border: none;
            color: #F57C00;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 32px;
            text-align: center;
        }

        .submit-btn:disabled {
            background-color: #A5D6A7;
            cursor: not-allowed;
        }

        #loading-indicator {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Monthly Grocery List</h1>

    <div id="loading-indicator">Syncing with database...</div>

    <div id="main-list-container" style="display: none;">
        <div id="main-grocery-list"></div>

        <h2>AI Suggestions</h2>
        <div id="ai-recommendations-list"></div>

        <button class="submit-btn" id="submit-btn" onclick="submitToWhatsApp()">Submit & Share to WhatsApp</button>
    </div>
</div>

<script>
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxAdS7UEjvvgEkvNqRFPmk0nKPhQaH3-0-hRITOPL4EDpVElMKrVgD-FLei_LMgy040/exec"; 
    let databaseItems = [];

    const quantityOptions = {
        'Weight': ["100g", "250g", "500g", "1kg", "2kg", "3kg", "5kg", "10kg"],
        'Volume': ["250ml", "500ml", "1L", "2L", "5L"],
        'Count': ["1", "2", "3", "4", "5", "6", "10", "1 Dozen", "2 Dozen"]
    };

    const defaultQuantities = {
        'Weight': '1kg',
        'Volume': '1L',
        'Count': '1'
    };

    let aiRecommendations = [
        { id: 101, name: "Butter", contextReason: "Frequently purchased with Bread" },
        { id: 102, name: "Tea Powder", contextReason: "Trending essential" }
    ];

    window.onload = fetchDatabaseItems;

    async function fetchDatabaseItems() {
        try {
            const response = await fetch(GOOGLE_SHEET_API_URL);
            const data = await response.json();
            
            databaseItems = data.map(item => ({
                ...item, 
                selected: false,
                currentQuantity: item.lastQuantity || defaultQuantities[item.unitType] || '1'
            }));

            document.getElementById('loading-indicator').style.display = 'none';
            document.getElementById('main-list-container').style.display = 'block';
            
            renderGroceryList();
            renderAIList();
        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById('loading-indicator').innerText = "Failed to load database. Please check connection.";
        }
    }

    function renderGroceryList() {
        const container = document.getElementById('main-grocery-list');
        container.innerHTML = '';

        databaseItems.forEach(item => {
            const div = document.createElement('div');
            div.className = `list-item-container ${item.selected ? 'selected' : ''}`;

            const checkIcon = item.selected ? '✓' : '';
            const recentFlag = item.orderedInLast30Days ? '<div class="item-meta">Ordered in last 30 days</div>' : '';

            const optionsHTML = (quantityOptions[item.unitType] || quantityOptions['Count'])
                .map(opt => `<option value="${opt}" ${item.currentQuantity === opt ? 'selected' : ''}>${opt}</option>`)
                .join('');

            div.innerHTML = `
                <div class="list-item" onclick="toggleSelection(${item.id})">
                    <div class="icon-container">${checkIcon}</div>
                    <div class="item-details">
                        <div class="item-name">${item.name}</div>
                        ${recentFlag}
                    </div>
                </div>
                <div class="quantity-selector">
                    <select onchange="updateQuantity(${item.id}, this.value)">
                        ${optionsHTML}
                    </select>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function toggleSelection(id) {
        const item = databaseItems.find(i => i.id === id);
        if (item) {
            item.selected = !item.selected;
            renderGroceryList();
        }
    }

    function updateQuantity(id, value) {
        const item = databaseItems.find(i => i.id === id);
        if (item) {
            item.currentQuantity = value;
        }
    }

    function renderAIList() {
        const container = document.getElementById('ai-recommendations-list');
        container.innerHTML = '';

        if (aiRecommendations.length === 0) {
            container.innerHTML = '<div class="item-meta" style="padding: 16px 0;">No new recommendations.</div>';
            return;
        }

        aiRecommendations.forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item-container';
            
            div.innerHTML = `
                <div class="list-item">
                    <div class="icon-container" style="color: #1976D2;">✨</div>
                    <div class="item-details">
                        <div class="item-name">${item.name}</div>
                        <div class="item-meta ai-reason">${item.contextReason}</div>
                    </div>
                    <button class="bookmark-btn" onclick="handleBookmarkClick(${item.id}, this)">➕</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    async function handleBookmarkClick(id, buttonElement) {
        const index = aiRecommendations.findIndex(i => i.id === id);
        if (index === -1) return;

        buttonElement.style.opacity = '0.5';
        buttonElement.disabled = true;

        const aiItem = aiRecommendations[index];

        try {
            await fetch(GOOGLE_SHEET_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'addItem', name: aiItem.name }),
            });

            aiRecommendations.splice(index, 1);
            
            databaseItems.unshift({
                id: Date.now(),
                name: aiItem.name,
                orderedInLast30Days: false,
                selected: true,
                unitType: 'Count',
                currentQuantity: '1',
                count: 0
            });

            renderGroceryList();
            renderAIList();
        } catch (e) {
            alert("Failed to add to database.");
            buttonElement.style.opacity = '1';
            buttonElement.disabled = false;
        }
    }

    async function submitToWhatsApp() {
        const selectedItems = databaseItems.filter(i => i.selected);
        if (selectedItems.length === 0) {
            alert("Please select at least one item.");
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const payload = selectedItems.map(i => ({ name: i.name, quantity: i.currentQuantity }));

        try {
            await fetch(GOOGLE_SHEET_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'submit', items: payload }),
            });
            
            const formattedItems = selectedItems.map(i => `✅ ${i.name} - ${i.currentQuantity}`).join('%0A');
            const textMessage = `Hi! Here is the monthly grocery list:%0A%0A${formattedItems}`;
            
            window.open(`whatsapp://send?text=${textMessage}`, '_blank');
        } catch (error) {
            alert("Failed to sync with database. Please try again.");
        } finally {
            btn.innerText = "Submit & Share to WhatsApp";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
