<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const R = window.Recharts;

/* =============================================================
 * CONFIG — paste your deployed Apps Script /exec URL here
 * ============================================================= */
const WEB_APP_URL = ""; // e.g. "https://script.google.com/macros/s/AKfy.../exec"

const USERS = { U1: 'Amit', U2: 'Alka' };

const BASELINE = [
  { category: 'Home Loan EMI',        split: '50/50' },
  { category: 'Monthly Rent',         split: '50/50' },
  { category: 'Society Maintenance',  split: '50/50' },
  { category: 'Grocery',              split: '50/50' },
  { category: 'Cook Salary',          split: 'Amit'  },
  { category: 'Cleaning Maid Salary', split: 'Amit'  },
  { category: 'Nanny Salary',         split: 'Amit'  },
  { category: 'Car Wash',             split: 'Amit'  },
  { category: 'Electricity Bill',     split: 'Amit'  },
  { category: 'Broadband Bill',       split: 'Amit'  },
];

const CARD_OWNERS = {
  'HDFC Swiggy':          'Alka',
  'Axis Airtel':          'Amit',
  'Amex Platinum Travel': 'Amit',
  'Tata Neu Infinity':    'Amit',
  'Yes Bank Marquee':     'Amit',
};

/* Merchant → baseline category map for SMS auto-categorization */
const MERCHANT_MAP = [
  { match: /(swiggy|instamart|zepto|blinkit|bigbasket|dunzo|zomato)/i, category: 'Grocery',          split: '50/50' },
  { match: /(bescom|electricity|tneb|msedcl|adani\s?ele)/i,            category: 'Electricity Bill', split: 'Amit'  },
  { match: /(airtel|jio.?fiber|act\s?fiber|broadband|hathway)/i,        category: 'Broadband Bill',   split: 'Amit'  },
  { match: /(society|maintenance|apnacomplex|mygate)/i,                 category: 'Society Maintenance', split: '50/50' },
  { match: /(rent|landlord|nobroker)/i,                                 category: 'Monthly Rent',     split: '50/50' },
  { match: /(emi|home\s?loan|hdfc\s?loan)/i,                            category: 'Home Loan EMI',    split: '50/50' },
  { match: /(cook|maid|nanny|domestic|housekeep)/i,                     category: 'Cook Salary',      split: 'Amit'  },
  { match: /(car\s?wash|car\s?spa)/i,                                   category: 'Car Wash',         split: 'Amit'  },
];

/* ============================================================= */
/* API helper                                                    */
/* ============================================================= */
async function api(action, payload = {}, method = 'POST') {
  if (!WEB_APP_URL) {
    console.warn('[BillSplit] WEB_APP_URL is empty — running in offline demo mode.');
    return offlineMock(action, payload);
  }
  try {
    const url = WEB_APP_URL + '?action=' + encodeURIComponent(action);
    const opts = method === 'GET'
      ? { method: 'GET' }
      : { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } };
    const res = await fetch(url, opts);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'API error');
    return j.data;
  } catch (e) {
    console.error('[BillSplit] api error', e);
    throw e;
  }
}

/* Offline demo store so the UI is usable without Apps Script deployed */
const _mock = { summary: [], cards: [], borrows: [], granular: [] };
function offlineMock(action, p) {
  if (action === 'bootstrap') return { settings: { user1: USERS.U1, user2: USERS.U2, baseline: BASELINE, cardMap: CARD_OWNERS },
    summary: _mock.summary, cards: _mock.cards, borrows: _mock.borrows, granular: _mock.granular };
  if (action === 'saveMonth') {
    _mock.summary = _mock.summary.filter(r => r.Month !== p.month);
    _mock.summary.push({ Month: p.month, User1_Total: p.totals.user1, User2_Total: p.totals.user2, Grand_Total: p.totals.grand, UpdatedAt: new Date().toISOString() });
    _mock.cards = _mock.cards.filter(r => r.Month !== p.month);
    (p.cards||[]).forEach(c => _mock.cards.push({ Month: p.month, Card: c.card, Owner: c.owner, GrossTotal: c.gross, AdHoc: c.adhoc||[] }));
    _mock.granular = _mock.granular.filter(r => r.Month !== p.month);
    (p.fixed||[]).forEach(f => _mock.granular.push({ Month: p.month, Category: f.category, Owner: f.owner, Amount: f.amount, Type: 'Baseline', Source: 'Fixed' }));
    (p.cards||[]).forEach(c => {
      _mock.granular.push({ Month: p.month, Category: 'Card:'+c.card, Owner: c.owner, Amount: c.gross, Type: 'Card', Source: 'Statement' });
      (c.adhoc||[]).forEach(a => _mock.granular.push({ Month: p.month, Category: a.desc, Owner: a.owner||c.owner, Amount: a.amount, Type: 'Ad-Hoc', Source: 'Card:'+c.card }));
    });
    return { savedMonth: p.month };
  }
  if (action === 'addBorrow') {
    const id = 'BR-' + Date.now();
    _mock.borrows.push({ ID: id, Date: p.date, Borrower: p.borrower, Lender: p.lender, Description: p.description, Principal: p.principal, Repaid: 0, Status: 'Active', RepaymentsJSON: '[]' });
    return { id };
  }
  if (action === 'repayBorrow') {
    const b = _mock.borrows.find(x => x.ID === p.id);
    if (b) {
      b.Repaid = Number(b.Repaid) + Number(p.amount);
      const log = JSON.parse(b.RepaymentsJSON||'[]'); log.push({ date: p.date, amount: p.amount, note: p.note||'' });
      b.RepaymentsJSON = JSON.stringify(log);
      if (b.Repaid >= Number(b.Principal)) b.Status = 'Settled';
    }
    return { ok: true };
  }
  return {};
}

/* ============================================================= */
/* Utilities                                                     */
/* ============================================================= */
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
const monthKey = d => {
  const dt = d instanceof Date ? d : new Date(d);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0');
};
const uid = () => Math.random().toString(36).slice(2,10);

/* ============================================================= */
/* SMS Parser                                                    */
/* ============================================================= */
const NOISE = /(otp|one\s*time\s*password|due\s*by|offer|reward|cashback\s*earned|available\s*bal|balance\s*is|statement\s*generated|payment\s*due|min\.\s*amount)/i;

function parseSms(raw) {
  if (!raw) return [];
  // split by newlines OR by common backup delimiters ("<sms ...>" style)
  const chunks = raw
    .replace(/<sms[^>]*body="([^"]*)"[^>]*\/>/gi, '\n$1\n')
    .split(/\r?\n|(?<=\.)\s{2,}/)
    .map(s => s.trim())
    .filter(Boolean);

  const results = [];
  chunks.forEach(text => {
    if (NOISE.test(text)) return;
    const amt = text.match(/(?:inr|rs\.?|₹)\s*([0-9]+(?:[,.][0-9]+)*)/i);
    if (!amt) return;
    const amount = Number(amt[1].replace(/,/g,''));
    if (!amount || amount < 1) return;

    let type = 'Debit';
    if (/refund|reversed|credited/i.test(text)) type = 'Refund';
    else if (/credited|received/i.test(text) && !/debited/i.test(text)) type = 'Credit';
    else if (/debited|spent|purchase|txn|paid at/i.test(text)) type = 'Debit';

    // bank / card
    let bank = '';
    const bankMatch = text.match(/(hdfc|axis|amex|american express|tata neu|yes bank|icici|sbi|kotak|idfc)[^.\n]{0,40}/i);
    if (bankMatch) bank = bankMatch[0].trim().replace(/\s+/g,' ');
    const cardTail = text.match(/(?:card|xx|xxxx|ending)\s*([0-9]{3,4})/i);
    if (cardTail) bank += ' ending ' + cardTail[1];

    // merchant: after "at" or "to" up to next punctuation
    let merchant = '';
    const m = text.match(/\b(?:at|to|towards|on)\s+([A-Z0-9][A-Z0-9 .&*_'\-]{2,40})/i);
    if (m) merchant = m[1].replace(/[*_]+/g,' ').trim();
    if (!merchant) {
      const m2 = text.match(/\b(swiggy|zomato|amazon|flipkart|bescom|airtel|jio|instamart|zepto|blinkit|bigbasket|dunzo|uber|ola|apple)\b/i);
      if (m2) merchant = m2[1];
    }
    merchant = merchant.toUpperCase();

    // date: dd-mm-yy or dd/mm/yyyy
    let date = '';
    const dm = text.match(/(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{2,4})/);
    if (dm) {
      const y = dm[3].length === 2 ? '20'+dm[3] : dm[3];
      date = y + '-' + dm[2].padStart(2,'0') + '-' + dm[1].padStart(2,'0');
    }
    const ym = date ? date.slice(0,7) : monthKey(new Date());

    // category mapping
    let category = 'Ad-Hoc', split = null;
    for (const rule of MERCHANT_MAP) {
      if (rule.match.test(merchant) || rule.match.test(text)) { category = rule.category; split = rule.split; break; }
    }

    results.push({
      id: uid(), date, month: ym, amount, bank, merchant, type, category, split, raw: text
    });
  });
  return results;
}

/* ============================================================= */
/* UI atoms                                                      */
/* ============================================================= */
function Card({ tone='surface', className='', children, ...rest }) {
  const tones = {
    surface: 'bg-surface',
    tonal:   'bg-tonal',
    dim:     'bg-tonalDim',
    teal:    'bg-tealSoft'
  };
  return <div className={`${tones[tone]||tones.surface} rounded-[32px] shadow-m3 p-5 spring ${className}`} {...rest}>{children}</div>;
}
function Pill({ active, children, ...p }) {
  return <button {...p} className={`press spring rounded-[24px] px-4 py-2 text-sm font-medium ${active ? 'bg-teal text-white shadow-m3' : 'bg-tonal text-ink'}`}>{children}</button>;
}
function Field({ label, children, hint }) {
  return (
    <label className="block">
      <div className="text-xs font-medium text-inkDim mb-1.5 px-1">{label}</div>
      {children}
      {hint && <div className="text-[11px] text-inkDim mt-1 px-1">{hint}</div>}
    </label>
  );
}
function TxtInput(props) {
  return <input {...props} className={`w-full rounded-[24px] bg-tonalDim px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal/40 ${props.className||''}`} />;
}
function SelectInput({ children, ...props }) {
  return <select {...props} className={`w-full rounded-[24px] bg-tonalDim px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal/40 ${props.className||''}`}>{children}</select>;
}
function Btn({ variant='primary', className='', children, ...p }) {
  const v = {
    primary: 'bg-teal text-white shadow-m3',
    tonal:   'bg-tealSoft text-teal',
    ghost:   'bg-transparent text-teal',
    danger:  'bg-danger/10 text-danger',
  }[variant];
  return <button {...p} className={`press spring rounded-[24px] px-5 py-3 text-sm font-semibold ${v} ${className}`}>{children}</button>;
}

/* Bottom Sheet */
function BottomSheet({ open, onClose, title, children }) {
  const [render, setRender] = useState(open);
  const [closing, setClosing] = useState(false);
  useEffect(() => { if (open) { setRender(true); setClosing(false); } }, [open]);
  if (!render) return null;
  const close = () => { setClosing(true); setTimeout(() => { setRender(false); onClose && onClose(); }, 260); };
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center">
      <div className="absolute inset-0 bg-ink/40 fade-in" onClick={close}></div>
      <div className={`relative w-full max-w-xl bg-surface rounded-t-[32px] shadow-pop p-5 max-h-[85vh] overflow-y-auto scroll-hide ${closing ? 'sheet-exit' : 'sheet-enter'}`}>
        <div className="w-12 h-1.5 rounded-full bg-tonal mx-auto mb-3"></div>
        {title && <div className="text-lg font-bold mb-3">{title}</div>}
        {children}
      </div>
    </div>
  );
}

/* Bottom Nav */
function BottomNav({ tab, setTab, onHistory }) {
  const [hidden, setHidden] = useState(false);
  const lastY = useRef(0);
  useEffect(() => {
    const onScroll = () => {
      const y = window.scrollY;
      setHidden(y > lastY.current && y > 80);
      lastY.current = y;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const item = (id, icon, label) => (
    <button onClick={() => setTab(id)} className={`press spring flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-[20px] ${tab===id ? 'bg-tealSoft text-teal' : 'text-inkDim'}`}>
      <i className={`fa-solid ${icon} text-base`}></i>
      <span className="text-[10px] font-semibold">{label}</span>
    </button>
  );
  return (
    <div className={`fixed z-40 bottom-5 left-1/2 -translate-x-1/2 glass rounded-full shadow-pop px-2 py-1.5 flex items-center gap-1 spring ${hidden ? 'nav-hidden' : ''}`}>
      {item('entry','fa-plus','Entry')}
      {item('dashboard','fa-chart-pie','Dashboard')}
      <button onClick={onHistory} className="press spring flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-[20px] text-inkDim">
        <i className="fa-solid fa-clock-rotate-left text-base"></i>
        <span className="text-[10px] font-semibold">History</span>
      </button>
    </div>
  );
}

/* ============================================================= */
/* Header                                                        */
/* ============================================================= */
function Header({ month, onMonth }) {
  return (
    <div className="pt-6 pb-3 px-5 flex items-center justify-between">
      <div>
        <div className="text-[11px] uppercase tracking-widest text-inkDim">BillSplit Pro</div>
        <div className="text-2xl font-bold">Household Ledger</div>
      </div>
      <input type="month" value={month} onChange={e => onMonth(e.target.value)}
        className="rounded-[20px] bg-surface shadow-m3 px-3 py-2 text-sm font-semibold" />
    </div>
  );
}

/* ============================================================= */
/* ENTRY VIEW                                                    */
/* ============================================================= */
function EntryView({ month, draft, setDraft, onSave, saving }) {
  const cards = draft.cards;
  const fixed = draft.fixed;

  const updateCard  = (i, k, v) => setDraft({ ...draft, cards: cards.map((c,idx)=> idx===i ? {...c,[k]:v} : c) });
  const addAdhoc    = (i)       => setDraft({ ...draft, cards: cards.map((c,idx)=> idx===i ? {...c, adhoc:[...c.adhoc, {id:uid(),desc:'',amount:0,owner:c.owner}]} : c) });
  const updateAdhoc = (i,j,k,v) => setDraft({ ...draft, cards: cards.map((c,idx)=> idx===i ? {...c, adhoc:c.adhoc.map((a,jd)=>jd===j?{...a,[k]:v}:a)} : c) });
  const delAdhoc    = (i,j)     => setDraft({ ...draft, cards: cards.map((c,idx)=> idx===i ? {...c, adhoc:c.adhoc.filter((_,jd)=>jd!==j)} : c) });

  const addFixed  = () => setDraft({ ...draft, fixed: [...fixed, { id: uid(), category: BASELINE[0].category, amount: 0, owner: 'Amit' }] });
  const setFixed  = (i,k,v) => setDraft({ ...draft, fixed: fixed.map((f,idx)=>idx===i?{...f,[k]:v}:f) });
  const delFixed  = (i)   => setDraft({ ...draft, fixed: fixed.filter((_,idx)=>idx!==i) });

  return (
    <div className="px-4 space-y-4 fade-in">
      <Card tone="teal">
        <div className="text-xs font-semibold text-teal/80 uppercase tracking-wider">Billing month</div>
        <div className="text-3xl font-bold mt-1">{month}</div>
        <div className="text-sm text-inkDim mt-1">Log statements, ad-hoc line items and offline spends. Save when reconciled.</div>
      </Card>

      {/* SMS Ingestion */}
      <SmsImportCard draft={draft} setDraft={setDraft} month={month} />

      {/* Cards */}
      <Card>
        <div className="flex items-center justify-between mb-3">
          <div className="text-base font-bold">Credit card statements</div>
          <span className="text-xs text-inkDim">{cards.length} cards</span>
        </div>
        <div className="space-y-3">
          {cards.map((c,i) => (
            <div key={c.card} className="rounded-[24px] bg-tonalDim p-4">
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-sm font-semibold">{c.card}</div>
                  <div className="text-[11px]" style={{color:c.owner==='Amit'?'#0E6E62':'#B3541E'}}>Owner · {c.owner}</div>
                </div>
                <div className="w-32">
                  <TxtInput type="number" inputMode="decimal" placeholder="Gross ₹" value={c.gross||''}
                    onChange={e=>updateCard(i,'gross',Number(e.target.value)||0)} />
                </div>
              </div>
              {c.adhoc.length>0 && (
                <div className="mt-3 space-y-2">
                  {c.adhoc.map((a,j)=>(
                    <div key={a.id} className="grid grid-cols-12 gap-2 items-center">
                      <input value={a.desc} onChange={e=>updateAdhoc(i,j,'desc',e.target.value)} placeholder="Description"
                        className="col-span-6 rounded-[16px] bg-surface px-3 py-2 text-xs outline-none" />
                      <input value={a.amount||''} type="number" onChange={e=>updateAdhoc(i,j,'amount',Number(e.target.value)||0)} placeholder="₹"
                        className="col-span-3 rounded-[16px] bg-surface px-3 py-2 text-xs outline-none" />
                      <select value={a.owner} onChange={e=>updateAdhoc(i,j,'owner',e.target.value)}
                        className="col-span-2 rounded-[16px] bg-surface px-2 py-2 text-xs">
                        <option>Amit</option><option>Alka</option><option>50/50</option>
                      </select>
                      <button onClick={()=>delAdhoc(i,j)} className="col-span-1 text-danger press"><i className="fa-solid fa-xmark"></i></button>
                    </div>
                  ))}
                </div>
              )}
              <button onClick={()=>addAdhoc(i)} className="press mt-3 text-xs font-semibold text-teal">
                <i className="fa-solid fa-plus mr-1"></i>Add ad-hoc override
              </button>
            </div>
          ))}
        </div>
      </Card>

      {/* Fixed / offline */}
      <Card tone="dim">
        <div className="flex items-center justify-between mb-3">
          <div className="text-base font-bold">Offline &amp; fixed spends</div>
          <Btn variant="tonal" onClick={addFixed}><i className="fa-solid fa-plus mr-1"></i>Add</Btn>
        </div>
        <div className="space-y-2">
          {fixed.length===0 && <div className="text-xs text-inkDim">No baseline entries logged.</div>}
          {fixed.map((f,i)=>(
            <div key={f.id} className="grid grid-cols-12 gap-2 items-center">
              <select value={f.category} onChange={e=>setFixed(i,'category',e.target.value)}
                className="col-span-6 rounded-[20px] bg-surface px-3 py-2 text-xs">
                {BASELINE.map(b => <option key={b.category}>{b.category}</option>)}
              </select>
              <input type="number" value={f.amount||''} onChange={e=>setFixed(i,'amount',Number(e.target.value)||0)} placeholder="₹"
                className="col-span-3 rounded-[20px] bg-surface px-3 py-2 text-xs" />
              <select value={f.owner} onChange={e=>setFixed(i,'owner',e.target.value)}
                className="col-span-2 rounded-[20px] bg-surface px-2 py-2 text-xs">
                <option>Amit</option><option>Alka</option><option>50/50</option>
              </select>
              <button onClick={()=>delFixed(i)} className="col-span-1 text-danger press"><i className="fa-solid fa-xmark"></i></button>
            </div>
          ))}
        </div>
      </Card>

      {/* Borrow */}
      <BorrowCard draft={draft} setDraft={setDraft} />

      <div className="sticky bottom-24 z-30 flex justify-end">
        <Btn onClick={onSave} disabled={saving} className="shadow-pop">
          {saving ? <><i className="fa-solid fa-circle-notch fa-spin mr-2"></i>Syncing…</> : <><i className="fa-solid fa-cloud-arrow-up mr-2"></i>Sync to Sheet</>}
        </Btn>
      </div>
    </div>
  );
}

/* SMS import zone */
function SmsImportCard({ draft, setDraft, month }) {
  const [raw, setRaw] = useState('');
  const [parsed, setParsed] = useState([]);
  const inputRef = useRef();

  const runParse = () => setParsed(parseSms(raw));
  const clear = () => { setRaw(''); setParsed([]); };

  const onFile = async (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const text = await f.text();
    setRaw(text);
    setParsed(parseSms(text));
  };

  const acceptAll = () => {
    const cards = [...draft.cards];
    const fixed = [...draft.fixed];
    parsed.filter(p => p.type !== 'Refund').forEach(p => {
      if (p.category !== 'Ad-Hoc' && BASELINE.find(b => b.category === p.category)) {
        // send to baseline / offline
        fixed.push({ id: uid(), category: p.category, amount: p.amount, owner: p.split === '50/50' ? '50/50' : p.split || 'Amit' });
      } else {
        // append to matching card, else first card
        const cardKey = Object.keys(CARD_OWNERS).find(k => new RegExp(k.replace(/\s+/g,'.?'),'i').test(p.bank||''));
        const idx = cardKey ? cards.findIndex(c => c.card === cardKey) : 0;
        if (idx >= 0) cards[idx] = { ...cards[idx], adhoc: [...cards[idx].adhoc, { id: uid(), desc: p.merchant || 'SMS import', amount: p.amount, owner: cards[idx].owner }] };
      }
    });
    setDraft({ ...draft, cards, fixed });
    clear();
  };

  return (
    <Card tone="tonal">
      <div className="flex items-center justify-between mb-2">
        <div>
          <div className="text-base font-bold"><i className="fa-solid fa-message-lines mr-2 text-teal"></i>Import SMS backup</div>
          <div className="text-xs text-inkDim">Paste raw SMS text or upload an XML/CSV/TXT export. We auto-categorize and route to cards or baselines.</div>
        </div>
        <input ref={inputRef} type="file" accept=".xml,.csv,.txt" className="hidden" onChange={onFile} />
        <Btn variant="tonal" onClick={()=>inputRef.current?.click()}><i className="fa-solid fa-upload mr-1"></i>File</Btn>
      </div>
      <textarea value={raw} onChange={e=>setRaw(e.target.value)} rows={4}
        placeholder="Paste SMS messages here…"
        className="w-full rounded-[20px] bg-surface p-3 text-xs outline-none focus:ring-2 focus:ring-teal/40"></textarea>
      <div className="flex gap-2 mt-2">
        <Btn onClick={runParse} disabled={!raw.trim()}>Parse</Btn>
        {parsed.length>0 && <Btn variant="tonal" onClick={acceptAll}>Accept {parsed.length} entries</Btn>}
        {(raw || parsed.length>0) && <Btn variant="ghost" onClick={clear}>Clear</Btn>}
      </div>
      {parsed.length>0 && (
        <div className="mt-3 space-y-1.5 max-h-64 overflow-y-auto scroll-hide">
          {parsed.map(p => (
            <div key={p.id} className="rounded-[18px] bg-surface p-2 text-xs flex items-center gap-2">
              <span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold ${p.type==='Debit'?'bg-danger/10 text-danger':p.type==='Refund'?'bg-teal/10 text-teal':'bg-tonal text-inkDim'}`}>{p.type}</span>
              <div className="flex-1 min-w-0">
                <div className="font-semibold truncate">{p.merchant || 'Unknown'} <span className="text-inkDim font-normal">· {p.category}</span></div>
                <div className="text-inkDim truncate">{p.bank || '—'} · {p.date || month}</div>
              </div>
              <div className="font-bold">{inr(p.amount)}</div>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

/* Borrow entry */
function BorrowCard({ draft, setDraft }) {
  const b = draft.newBorrow;
  const set = (k,v) => setDraft({ ...draft, newBorrow: { ...b, [k]: v } });
  const add = () => {
    if (!b.principal) return;
    setDraft({ ...draft, borrowQueue: [...draft.borrowQueue, { ...b, id: uid() }],
      newBorrow: { date: new Date().toISOString().slice(0,10), borrower:'Amit', lender:'Alka', description:'', principal: 0 }
    });
  };
  return (
    <Card tone="dim">
      <div className="text-base font-bold mb-3">Log a new borrow</div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Borrower"><SelectInput value={b.borrower} onChange={e=>set('borrower',e.target.value)}><option>Amit</option><option>Alka</option></SelectInput></Field>
        <Field label="Lender"><SelectInput value={b.lender} onChange={e=>set('lender',e.target.value)}><option>Alka</option><option>Amit</option></SelectInput></Field>
        <Field label="Principal ₹"><TxtInput type="number" value={b.principal||''} onChange={e=>set('principal',Number(e.target.value)||0)} /></Field>
        <Field label="Date"><TxtInput type="date" value={b.date} onChange={e=>set('date',e.target.value)} /></Field>
        <div className="col-span-2"><Field label="Description"><TxtInput value={b.description} onChange={e=>set('description',e.target.value)} placeholder="e.g. Iyengar wedding gift" /></Field></div>
      </div>
      <div className="mt-3 flex justify-end"><Btn variant="tonal" onClick={add}><i className="fa-solid fa-plus mr-1"></i>Queue borrow</Btn></div>
      {draft.borrowQueue.length>0 && (
        <div className="mt-3 space-y-1.5">
          {draft.borrowQueue.map(q => (
            <div key={q.id} className="rounded-[18px] bg-surface p-2 text-xs flex items-center gap-2">
              <i className="fa-solid fa-hand-holding-dollar text-teal"></i>
              <div className="flex-1"><span className="font-semibold">{q.borrower}</span> ← <span className="font-semibold">{q.lender}</span> · {q.description || 'no note'}</div>
              <div className="font-bold">{inr(q.principal)}</div>
            </div>
          ))}
          <div className="text-[11px] text-inkDim">Queued borrows are written on Sync.</div>
        </div>
      )}
    </Card>
  );
}

/* ============================================================= */
/* DASHBOARD                                                     */
/* ============================================================= */
function Dashboard({ draft, summary, granular }) {
  const totals = useMemo(() => computeTotals(draft), [draft]);
  const trend = useMemo(() => (summary||[]).map(r => ({ month: r.Month, total: Number(r.Grand_Total)||0, amit: Number(r.User1_Total)||0, alka: Number(r.User2_Total)||0 })).sort((a,b)=>a.month.localeCompare(b.month)), [summary]);
  const share = [ { name: 'Amit', value: totals.user1 }, { name: 'Alka', value: totals.user2 } ];
  const spikes = useMemo(() => {
    const map = {};
    (granular||[]).filter(r => r.Type === 'Ad-Hoc').forEach(r => { map[r.Month] = (map[r.Month]||0) + Number(r.Amount||0); });
    return Object.entries(map).map(([month,value])=>({month,value})).sort((a,b)=>a.month.localeCompare(b.month));
  }, [granular]);

  return (
    <div className="px-4 space-y-4 fade-in">
      <div className="grid grid-cols-3 gap-3">
        <Card tone="teal" className="col-span-3">
          <div className="text-xs font-semibold text-teal uppercase tracking-wider">Draft grand total</div>
          <div className="text-4xl font-bold mt-1">{inr(totals.grand)}</div>
          <div className="text-xs text-inkDim mt-1">Amit {inr(totals.user1)} · Alka {inr(totals.user2)}</div>
        </Card>
        <Card><div className="text-[11px] text-inkDim">Card gross</div><div className="text-xl font-bold">{inr(totals.cardGross)}</div></Card>
        <Card><div className="text-[11px] text-inkDim">Ad-hoc</div><div className="text-xl font-bold">{inr(totals.adhoc)}</div></Card>
        <Card><div className="text-[11px] text-inkDim">Baseline</div><div className="text-xl font-bold">{inr(totals.fixed)}</div></Card>
      </div>

      <Card>
        <div className="text-base font-bold mb-1">Total spend trend</div>
        <div className="h-56">
          <R.ResponsiveContainer>
            <R.LineChart data={trend} margin={{ left: 0, right: 8, top: 8, bottom: 0 }}>
              <R.CartesianGrid strokeDasharray="3 3" stroke="#E5EBE9" />
              <R.XAxis dataKey="month" tick={{ fontSize: 10 }} />
              <R.YAxis tick={{ fontSize: 10 }} tickFormatter={v => (v/1000).toFixed(0)+'k'} />
              <R.Tooltip formatter={v => inr(v)} />
              <R.Line type="monotone" dataKey="total" stroke="#0E6E62" strokeWidth={3} dot={{ r:3 }} />
              <R.Line type="monotone" dataKey="amit"  stroke="#0E6E62" strokeDasharray="4 4" dot={false} />
              <R.Line type="monotone" dataKey="alka"  stroke="#B3541E" strokeDasharray="4 4" dot={false} />
            </R.LineChart>
          </R.ResponsiveContainer>
        </div>
      </Card>

      <div className="grid grid-cols-2 gap-3">
        <Card>
          <div className="text-base font-bold mb-1">Aggregate share</div>
          <div className="h-48">
            <R.ResponsiveContainer>
              <R.PieChart>
                <R.Pie data={share} innerRadius={40} outerRadius={70} dataKey="value" paddingAngle={4}>
                  <R.Cell fill="#0E6E62" /><R.Cell fill="#B3541E" />
                </R.Pie>
                <R.Tooltip formatter={v=>inr(v)} />
                <R.Legend />
              </R.PieChart>
            </R.ResponsiveContainer>
          </div>
        </Card>
        <Card>
          <div className="text-base font-bold mb-1">Ad-hoc spikes</div>
          <div className="h-48">
            <R.ResponsiveContainer>
              <R.BarChart data={spikes}>
                <R.XAxis dataKey="month" tick={{ fontSize: 10 }} />
                <R.YAxis tick={{ fontSize: 10 }} tickFormatter={v => (v/1000).toFixed(0)+'k'} />
                <R.Tooltip formatter={v=>inr(v)} />
                <R.Bar dataKey="value" fill="#0E6E62" radius={[8,8,0,0]} />
              </R.BarChart>
            </R.ResponsiveContainer>
          </div>
        </Card>
      </div>
    </div>
  );
}

function computeTotals(draft) {
  let user1=0, user2=0, cardGross=0, adhoc=0, fixed=0;
  const attribute = (owner, amt) => {
    if (owner==='50/50') { user1 += amt/2; user2 += amt/2; }
    else if (owner==='Amit') user1 += amt;
    else if (owner==='Alka') user2 += amt;
  };
  draft.cards.forEach(c => {
    const adhocSum = c.adhoc.reduce((s,a)=>s+Number(a.amount||0),0);
    const base = Math.max(0, Number(c.gross||0) - adhocSum);
    cardGross += Number(c.gross||0);
    attribute(c.owner, base);
    c.adhoc.forEach(a => { adhoc += Number(a.amount||0); attribute(a.owner || c.owner, Number(a.amount||0)); });
  });
  draft.fixed.forEach(f => { fixed += Number(f.amount||0); attribute(f.owner, Number(f.amount||0)); });
  return { user1: Math.round(user1), user2: Math.round(user2), grand: Math.round(user1+user2), cardGross, adhoc, fixed };
}

/* ============================================================= */
/* HISTORY HUB / LOG / LEDGER                                    */
/* ============================================================= */
function HistoryHub({ open, onClose, onOpenLog, onOpenLedger }) {
  return (
    <BottomSheet open={open} onClose={onClose} title="History">
      <div className="grid grid-cols-2 gap-3">
        <button onClick={onOpenLog} className="press spring rounded-[28px] bg-tonal p-5 text-left">
          <i className="fa-solid fa-book-open text-2xl text-teal"></i>
          <div className="font-bold mt-3">History Log</div>
          <div className="text-xs text-inkDim">Statements, spikes, baselines by month.</div>
        </button>
        <button onClick={onOpenLedger} className="press spring rounded-[28px] bg-tealSoft p-5 text-left">
          <i className="fa-solid fa-scale-balanced text-2xl text-teal"></i>
          <div className="font-bold mt-3">Borrow Ledger</div>
          <div className="text-xs text-inkDim">Active loans &amp; repayment history.</div>
        </button>
      </div>
    </BottomSheet>
  );
}

function HistoryLog({ open, onClose, months, granular }) {
  const [month, setMonth] = useState(months[months.length-1] || '');
  const [q, setQ] = useState('');
  useEffect(()=>{ if(!month && months.length) setMonth(months[months.length-1]); },[months]);
  const rows = (granular||[]).filter(r => r.Month === month && (!q || String(r.Category).toLowerCase().includes(q.toLowerCase()) || String(r.Owner).toLowerCase().includes(q.toLowerCase())));
  const adhoc = rows.filter(r => r.Type === 'Ad-Hoc');
  const baseline = rows.filter(r => r.Type !== 'Ad-Hoc');
  return (
    <BottomSheet open={open} onClose={onClose} title="History log">
      <div className="flex gap-2 mb-3 overflow-x-auto scroll-hide">
        {months.map(m => <Pill key={m} active={m===month} onClick={()=>setMonth(m)}>{m}</Pill>)}
      </div>
      <TxtInput placeholder="Search category or owner" value={q} onChange={e=>setQ(e.target.value)} />
      <div className="mt-3">
        <div className="text-xs font-semibold text-inkDim mb-1">Ad-hoc spikes</div>
        <ListRows rows={adhoc} accent="danger" />
        <div className="text-xs font-semibold text-inkDim mt-3 mb-1">Baseline &amp; statements</div>
        <ListRows rows={baseline} accent="teal" />
      </div>
    </BottomSheet>
  );
}
function ListRows({ rows, accent }) {
  if (!rows.length) return <div className="text-xs text-inkDim">Nothing here.</div>;
  return (
    <div className="space-y-1.5">
      {rows.map((r,i)=>(
        <div key={i} className="rounded-[18px] bg-tonalDim p-2.5 text-xs flex items-center gap-2">
          <span className={`w-1.5 h-6 rounded-full bg-${accent}`}></span>
          <div className="flex-1 min-w-0">
            <div className="font-semibold truncate">{r.Category}</div>
            <div className="text-inkDim">{r.Owner} · {r.Source || r.Type}</div>
          </div>
          <div className="font-bold">{inr(r.Amount)}</div>
        </div>
      ))}
    </div>
  );
}

function BorrowLedger({ open, onClose, borrows, onRepay }) {
  const active = borrows.filter(b => (b.Status||'Active') === 'Active');
  const settled = borrows.filter(b => (b.Status||'Active') === 'Settled');
  return (
    <BottomSheet open={open} onClose={onClose} title="Borrow ledger">
      <div className="space-y-3">
        <div>
          <div className="text-xs font-semibold text-inkDim mb-1">Active</div>
          {active.length===0 && <div className="text-xs text-inkDim">All clear ✨</div>}
          {active.map(b => <BorrowRow key={b.ID} b={b} onRepay={onRepay} />)}
        </div>
        <div>
          <div className="text-xs font-semibold text-inkDim mb-1">Settled</div>
          {settled.length===0 && <div className="text-xs text-inkDim">Nothing settled yet.</div>}
          {settled.map(b => <BorrowRow key={b.ID} b={b} settled />)}
        </div>
      </div>
    </BottomSheet>
  );
}
function BorrowRow({ b, onRepay, settled }) {
  const [amt, setAmt] = useState('');
  const principal = Number(b.Principal||0);
  const repaid = Number(b.Repaid||0);
  const pct = principal ? Math.min(100, Math.round(repaid/principal*100)) : 0;
  const log = (()=>{ try { return JSON.parse(b.RepaymentsJSON||'[]'); } catch { return []; } })();
  return (
    <div className="rounded-[24px] bg-tonalDim p-3 mb-2">
      <div className="flex items-center justify-between">
        <div className="text-sm font-semibold">{b.Borrower} ← {b.Lender}</div>
        <div className="text-xs text-inkDim">{b.Date}</div>
      </div>
      <div className="text-xs text-inkDim">{b.Description || '—'}</div>
      <div className="mt-2 h-2 bg-surface rounded-full overflow-hidden">
        <div className="h-full bg-teal spring" style={{ width: pct+'%' }}></div>
      </div>
      <div className="text-[11px] text-inkDim mt-1">{inr(repaid)} / {inr(principal)} · {pct}%</div>
      {!settled && (
        <div className="flex gap-2 mt-2">
          <input type="number" value={amt} onChange={e=>setAmt(e.target.value)} placeholder="Repay ₹"
            className="flex-1 rounded-[16px] bg-surface px-3 py-2 text-xs" />
          <Btn variant="tonal" onClick={()=>{ if(amt){ onRepay(b.ID, Number(amt)); setAmt(''); } }}>Log</Btn>
        </div>
      )}
      {log.length>0 && (
        <details className="mt-2">
          <summary className="text-[11px] text-inkDim cursor-pointer">Repayment history ({log.length})</summary>
          <div className="mt-1 space-y-1">
            {log.map((l,i)=>(<div key={i} className="text-[11px] flex justify-between"><span>{l.date}</span><span className="font-semibold">{inr(l.amount)}</span></div>))}
          </div>
        </details>
      )}
    </div>
  );
}

/* ============================================================= */
/* Root App                                                      */
/* ============================================================= */
function App() {
  const [tab, setTab] = useState('entry');
  const [month, setMonth] = useState(monthKey(new Date()));
  const [saving, setSaving] = useState(false);
  const [boot, setBoot] = useState({ summary:[], cards:[], borrows:[], granular:[] });
  const [historyOpen, setHistoryOpen] = useState(false);
  const [logOpen, setLogOpen] = useState(false);
  const [ledgerOpen, setLedgerOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const emptyDraft = () => ({
    cards: Object.entries(CARD_OWNERS).map(([card, owner]) => ({ card, owner, gross: 0, adhoc: [] })),
    fixed: [],
    borrowQueue: [],
    newBorrow: { date: new Date().toISOString().slice(0,10), borrower:'Amit', lender:'Alka', description:'', principal: 0 }
  });
  const [draft, setDraft] = useState(emptyDraft());

  useEffect(() => { (async () => {
    try { const b = await api('bootstrap', {}, 'GET'); setBoot(b); } catch (e) { setToast(String(e.message||e)); }
  })(); }, []);

  const notify = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 2400); };

  const save = async () => {
    setSaving(true);
    try {
      const totals = computeTotals(draft);
      await api('saveMonth', { month, cards: draft.cards, fixed: draft.fixed, totals });
      for (const q of draft.borrowQueue) {
        await api('addBorrow', { date: q.date, borrower: q.borrower, lender: q.lender, description: q.description, principal: q.principal });
      }
      const b = await api('bootstrap', {}, 'GET'); setBoot(b);
      setDraft(d => ({ ...d, borrowQueue: [] }));
      notify('Synced to Google Sheet');
    } catch (e) { notify('Sync failed: '+e.message); }
    finally { setSaving(false); }
  };

  const onRepay = async (id, amount) => {
    try { await api('repayBorrow', { id, amount, date: new Date().toISOString().slice(0,10) });
      const b = await api('bootstrap', {}, 'GET'); setBoot(b); notify('Repayment logged'); }
    catch (e) { notify('Failed: '+e.message); }
  };

  const months = useMemo(()=>Array.from(new Set((boot.granular||[]).map(r=>r.Month))).sort(), [boot.granular]);

  return (
    <div className="max-w-xl mx-auto">
      <Header month={month} onMonth={setMonth} />
      {tab === 'entry'     && <EntryView month={month} draft={draft} setDraft={setDraft} onSave={save} saving={saving} />}
      {tab === 'dashboard' && <Dashboard draft={draft} summary={boot.summary} granular={boot.granular} />}

      <BottomNav tab={tab} setTab={setTab} onHistory={()=>setHistoryOpen(true)} />

      <HistoryHub open={historyOpen} onClose={()=>setHistoryOpen(false)}
        onOpenLog={()=>{ setHistoryOpen(false); setTimeout(()=>setLogOpen(true), 260); }}
        onOpenLedger={()=>{ setHistoryOpen(false); setTimeout(()=>setLedgerOpen(true), 260); }} />
      <HistoryLog open={logOpen} onClose={()=>setLogOpen(false)} months={months} granular={boot.granular} />
      <BorrowLedger open={ledgerOpen} onClose={()=>setLedgerOpen(false)} borrows={boot.borrows||[]} onRepay={onRepay} />

      {toast && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-ink text-white text-xs font-semibold px-4 py-2 rounded-full shadow-pop fade-in">{toast}</div>
      )}

      {!WEB_APP_URL && (
        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-danger/10 text-danger text-[11px] font-semibold px-3 py-1.5 rounded-full">
          Offline demo — set WEB_APP_URL in index.html
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
